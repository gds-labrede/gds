<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDS — Contrôle ICPE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --white:#fff;
  --border:#e2e7ef; --border-hi:#c9d2e0;
  --text:#16203a; --text-mid:#5c6883; --text-low:#98a1b5;
  --navy:#1a2e55; --orange:#c2701c; --rouge:#b8342f; --vert:#1d7a5f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;
  padding:0 32px;height:60px;background:var(--white);
  border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(20,32,60,.07)}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-size:18px;font-weight:700;letter-spacing:-.4px}
.logo span{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text-low)}
.sp{flex:1}
.lien{display:inline-flex;align-items:center;gap:7px;background:var(--white);
  border:1px solid var(--border);border-radius:8px;padding:8px 13px;color:var(--text-mid);
  font-family:'DM Sans',sans-serif;font-size:12.5px;text-decoration:none;cursor:pointer;
  transition:border-color .18s,color .18s}
.lien:hover{border-color:var(--border-hi);color:var(--text)}
.pastille{width:33px;height:33px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#2a4576,var(--navy));color:#fff;font-size:12px;font-weight:700}

.page{max-width:1400px;margin:0 auto;padding:30px 32px 60px}
h1{font-size:25px;font-weight:700;letter-spacing:-.5px}
.accroche{font-size:13.5px;color:var(--text-mid);margin-top:5px;margin-bottom:20px}

/* ══ COMPTEURS ══ */
.bilan{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.bil{background:linear-gradient(180deg,#fff,#fbfcfe);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;box-shadow:0 1px 2px rgba(20,32,60,.05),inset 0 1px 0 #fff;cursor:pointer;
  transition:border-color .18s,box-shadow .18s,transform .18s}
.bil:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(20,32,60,.4)}
.bil.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy),0 10px 22px -12px rgba(20,32,60,.4)}
.bil-v{font-size:23px;font-weight:700;letter-spacing:-.6px}
.bil-l{font-size:12px;color:var(--text-mid);margin-top:2px}
.bil.risque .bil-v{color:var(--orange)}
.bil.sansfds .bil-v{color:var(--rouge)}
.bil.alcool .bil-v{color:#4a55a8}
.bil.neuf .bil-v{color:var(--navy)}
.bil.ok .bil-v{color:var(--vert)}

/* ══ FILTRES ══ */
.filtres{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.recherche{flex:1;min-width:220px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:13.5px;background:var(--white);outline:none;color:var(--text)}
.recherche:focus{border-color:var(--navy)}
select{padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--white);
  font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;cursor:pointer}
select:focus{border-color:var(--navy)}
.export{padding:11px 18px;border:none;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#f0913f,#d46c1a);color:#fff;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
  box-shadow:0 8px 18px -10px rgba(212,108,26,.9),inset 0 1px 0 rgba(255,255,255,.35)}
.export:hover{filter:brightness(1.07)}

/* ══ TABLEAU ══ */
.liste{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,32,60,.05)}
.ligne{display:grid;grid-template-columns:120px 1fr 92px 110px 118px 110px;gap:12px;align-items:center;
  padding:10px 16px;border-top:1px solid var(--border);font-size:13px}
.ligne:first-child{border-top:none}
.ligne.tete{background:#f7f9fc;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:1.3px;
  color:var(--text-low);text-transform:uppercase;padding:10px 16px}
.ligne:not(.tete):hover{background:#fafbfd}
.mgb{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-mid)}
.lib{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-mid)}
.num{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--text-mid);text-align:right}

.code{font-family:'DM Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.5px;
  padding:4px 8px;border-radius:5px;display:inline-block;
  background:#eaf1fb;color:#2d5a9e;border:1px solid #cfe0f5}
.code.sensible{background:#fdf3e7;color:var(--orange);border-color:#f0d5b0}
.code.aucun{background:var(--bg);color:var(--text-low);border-color:var(--border)}
.code.neuf{background:#eef0fb;color:#4a55a8;border-color:#ccd2ee}
.code.modifiable{cursor:pointer;transition:box-shadow .15s,transform .15s}
.code.modifiable:hover{box-shadow:0 0 0 2px rgba(26,46,85,.18);transform:translateY(-1px)}

.fds{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;
  padding:6px 11px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:700;
  color:#fff;background:linear-gradient(180deg,#2a9a78,var(--vert));
  box-shadow:0 5px 12px -7px rgba(29,122,95,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.fds:hover{filter:brightness(1.08)}
.fds svg{width:13px;height:13px;fill:#fff}
.manque{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.8px;font-weight:600;
  padding:4px 8px;border-radius:5px;background:#fdeaea;color:var(--rouge);border:1px solid #f2c2c2}
.rien{font-size:11.5px;color:var(--text-low)}
select.etat{padding:5px 7px;border-radius:7px;font-family:'DM Mono',monospace;
  font-size:10.5px;font-weight:600;letter-spacing:.4px;border:1px solid var(--border);
  background:var(--white);color:var(--text-mid);cursor:pointer}
select.etat.manque{background:#fdeaea;color:var(--rouge);border-color:#f2c2c2}
select.etat.attente{background:#eef0fb;color:#4a55a8;border-color:#ccd2ee}

.info{padding:34px;text-align:center;color:var(--text-low);font-size:13px}
.plus{padding:12px;text-align:center;color:var(--text-low);font-size:12px;border-top:1px solid var(--border)}

/* ══ LECTEUR ══ */
.voile{position:fixed;inset:0;z-index:50;background:rgba(14,22,42,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:24px}
.voile.on{display:flex}
.lecteur{width:min(1100px,100%);height:min(92vh,1200px);background:var(--white);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.lect-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#fff,#f7f9fc)}
.lect-t{flex:1;min-width:0}
.lect-nom{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lect-mgb{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-low);margin-top:2px}
.lecteur iframe{flex:1;border:none;background:#525659}
.lect-attente{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-low);font-size:13px}
.mini{background:var(--white);border:1px solid var(--border);border-radius:7px;padding:6px 10px;
  font-family:'DM Sans',sans-serif;font-size:11.5px;color:var(--text-mid);cursor:pointer}
.mini:hover{border-color:var(--navy);color:var(--navy)}

.toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{background:var(--navy);color:#fff;padding:12px 17px;border-radius:10px;font-size:13px;
  box-shadow:0 10px 30px -8px rgba(20,32,60,.5)}
.toast.ok{background:linear-gradient(180deg,#22916f,#1d7a5f)}
.toast.err{background:linear-gradient(180deg,#c44540,#b8342f)}

*:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
@media(max-width:900px){
  .bar{padding:0 16px}
  .page{padding:22px 16px 44px}
  .ligne{grid-template-columns:1fr 92px 110px}
  .ligne .mgb,.ligne .pos,.ligne .num{display:none}
  .ligne.tete{display:none}
}
</style>
</head>
<body>

<header class="bar">
  <div class="logo"><b>GDS</b><span>ICPE</span></div>
  <div class="sp"></div>
  <a class="lien" href="sommaire.html#danger">← Tableau de bord</a>
  <div class="pastille" id="pastille">–</div>
</header>

<main class="page">
  <h1>Contrôle ICPE</h1>
  <p class="accroche" id="accroche">Chargement…</p>

  <div class="bilan">
    <div class="bil risque"  onclick="vue('sensible')" id="v-sensible">
      <div class="bil-v" id="n-sensible">—</div><div class="bil-l">Articles sensibles en stock</div></div>
    <div class="bil sansfds" onclick="vue('sansfds')" id="v-sansfds">
      <div class="bil-v" id="n-sansfds">—</div><div class="bil-l">FDS manquantes</div></div>
    <div class="bil alcool"  onclick="vue('alcool')" id="v-alcool">
      <div class="bil-v" id="n-alcool">—</div><div class="bil-l">FDS demandées</div></div>
    <div class="bil neuf"    onclick="vue('neuf')" id="v-neuf">
      <div class="bil-v" id="n-neuf">—</div><div class="bil-l">Réfs hors référentiel</div></div>
    <div class="bil ok"      onclick="vue('tous')" id="v-tous">
      <div class="bil-v" id="n-tous">—</div><div class="bil-l">Articles en stock</div></div>
  </div>

  <div class="filtres">
    <input type="text" class="recherche" id="rech" placeholder="Rechercher un MGB ou une désignation…">
    <select id="f-code"><option value="">Tous les codes ICPE</option></select>
    <select id="f-sect"><option value="">Tous les secteurs</option></select>
    <select id="f-allee"><option value="">Toutes les allées</option></select>
    <select id="f-fds">
      <option value="">FDS — tous les états</option>
      <option value="MANQUANTE">Manquante</option>
      <option value="DEMANDEE">Demandée</option>
      <option value="PRESENTE">Présente</option>
      <option value="NON REQUISE">Non requise</option>
    </select>
    <button class="export" onclick="exporter()">Exporter</button>
    <button class="lien" id="b-ref" style="display:none" onclick="document.getElementById('f-ref').click()">Référentiel</button>
    <input type="file" id="f-ref" accept=".csv" style="display:none" onchange="deposerRef(this)">
    <button class="lien" id="b-annul" style="display:none" onclick="restaurer()">Annuler la séance</button>
  </div>

  <div class="liste" id="liste"><div class="info">Chargement…</div></div>
</main>

<div class="voile" id="voile" onclick="if(event.target===this) fermerLecteur()">
  <div class="lecteur">
    <div class="lect-h">
      <div class="lect-t">
        <div class="lect-nom" id="l-nom">—</div>
        <div class="lect-mgb" id="l-mgb">—</div>
      </div>
      <button class="mini" id="l-tel">Télécharger</button>
      <button class="mini" onclick="fermerLecteur()">Fermer</button>
    </div>
    <div class="lect-attente" id="l-attente">Ouverture…</div>
    <iframe id="l-cadre" title="Fiche de données de sécurité" style="display:none"></iframe>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="config.js"></script>
<script>
if (typeof GDS === 'undefined') {
  document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px">Fichier config.js absent.</p>';
  throw new Error('config.js absent');
}
var API = GDS.API, CLE_PUBLIQUE = GDS.CLE_PUBLIQUE;

/* ─────────────────────────────────────────────────────────
   Réglages métier
   ───────────────────────────────────────────────────────── */

/* Référentiel ICPE (MGB;CODE). Il vit dans le dossier technique :
   l'application le lit, mais il n'apparaît pas dans l'onglet Fichiers
   des comptes non administrateurs. */
var FICHIER_REFS  = 'systeme/icpe_refs.csv';

/* Copie de sécurité : l'état du référentiel à l'ouverture de la séance */
var FICHIER_SAUVE = 'systeme/icpe_refs_precedent.csv';

/* 1510 est la rubrique générique entrepôt : elle couvre la moitié
   du stock et ne signale aucun risque particulier. Les autres codes
   désignent les produits réellement sensibles. */
var CODE_GENERIQUE = '1510';

/* Rubriques qui n'appellent pas de FDS : les alcools de bouche sont
   des denrées alimentaires, exemptées de fiche de données de sécurité.
   Pour elles, c'est le volume stocké qui compte, pas la fiche. */
var SANS_FDS = ['4755'];

/* Secteur déduit du numéro d'allée (premier nombre de la position) */
var SECTEURS = [
  { nom:'Ambiant',            de:1,  a:18 },
  { nom:'Frais',              de:19, a:29 },
  { nom:'Fruits et légumes',  de:30, a:37 },
  { nom:'Surgelé',            de:38, a:49 },
  { nom:'La Marée',           de:50, a:59 }
];

var DOSSIER_FDS = 'FDS/';
var MAX_LIGNES = 400;

/* ══════════ SESSION ══════════ */
function lire(c){
  try { return sessionStorage.getItem(c) || localStorage.getItem(c); } catch(e){ return null; }
}
var jeton = lire('gds_jeton'), role = lire('gds_role'), nom = lire('gds_nom');
if(!jeton){
  alert('Session absente.\n\nOuvrez cet outil depuis le sommaire.');
}

/* Les produits dangereux ne concernent pas les inventoristes */
if(jeton && role !== 'admin' && role !== 'admin_restreint'){
  document.body.innerHTML =
    '<p style="font-family:system-ui,sans-serif;padding:48px;text-align:center;color:#5c6883">' +
    'Cet outil est réservé à l\'encadrement.<br><br>' +
    '<a href="sommaire.html" style="color:#1a2e55">Retour au tableau de bord</a></p>';
  throw new Error('accès refusé');
}
/* Seule l'administration modifie le référentiel */
var peutEditer = (role === 'admin');
/* Le bouton d'import n'apparaît que si le référentiel est absent :
   une fois en place, il n'y a plus moyen de l'écraser par mégarde. */
if(peutEditer) document.getElementById('b-annul').style.display = 'inline-flex';
document.getElementById('pastille').textContent =
  (nom || '?').split(' ').map(function(m){ return m[0]; }).join('').slice(0,2).toUpperCase();

function auth(sup){
  var h = { 'Authorization':'Bearer ' + CLE_PUBLIQUE, 'apikey':CLE_PUBLIQUE, 'X-GDS-Session':jeton };
  if(sup) for(var k in sup) h[k] = sup[k];
  return h;
}
function dire(t, type){
  var d = document.createElement('div');
  d.className = 'toast' + (type ? ' ' + type : '');
  d.textContent = t;
  document.getElementById('toasts').appendChild(d);
  setTimeout(function(){ d.remove(); }, 3600);
}
function refus(r){
  if(r.status === 401 || r.status === 403){ dire('Accès refusé par le serveur (' + r.status + ')', 'err'); return true; }
  return false;
}

/* ══════════ LECTURE CSV ══════════ */
/* Tout en texte : un MGB garde ses zéros de tête. */
function lireCSV(texte){
  var fin = texte.indexOf('\n');
  var tete = texte.slice(0, fin < 0 ? 200 : fin);
  var sep = (tete.split(';').length > tete.split(',').length) ? ';' : ',';
  var lignes = [], champ = '', ligne = [], guill = false;
  for(var i = 0; i < texte.length; i++){
    var c = texte[i];
    if(guill){
      if(c === '"'){ if(texte[i+1] === '"'){ champ += '"'; i++; } else guill = false; }
      else champ += c;
    }
    else if(c === '"') guill = true;
    else if(c === sep){ ligne.push(champ); champ = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && texte[i+1] === '\n') i++;
      ligne.push(champ); champ = '';
      if(ligne.length > 1 || ligne[0] !== '') lignes.push(ligne);
      ligne = [];
    }
    else champ += c;
  }
  if(champ !== '' || ligne.length){ ligne.push(champ); lignes.push(ligne); }
  return lignes;
}
function decoder(buf){
  var t = new TextDecoder('utf-8').decode(buf);
  if(t.indexOf('�') !== -1) t = new TextDecoder('windows-1252').decode(buf);
  return t.replace(/^﻿/, '');
}
function netMGB(v){ return String(v || '').trim().replace(/^'/, '').replace(/\s+/g, ''); }

function allee(position){
  var m = String(position || '').match(/^(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}
function secteur(a){
  if(a === null) return '—';
  for(var i = 0; i < SECTEURS.length; i++)
    if(a >= SECTEURS[i].de && a <= SECTEURS[i].a) return SECTEURS[i].nom;
  return 'Hors secteur';
}

/* ══════════ CHARGEMENT ══════════ */
var articles = [];   /* un par MGB */
var fiches = {};     /* MGB → nom du fichier FDS */
var refs = {};       /* référentiel complet : MGB → code */
var ordreRefs = [];  /* ordre d'origine du fichier */
var texteOrigine = '';       /* référentiel tel que trouvé à l'ouverture */
var refAbsent = false;       /* vrai seulement au tout premier démarrage */
var sauvegardeFaite = false;
var mode = 'sensible';

async function listerCourant(){
  var r = await fetch(API + '/fichiers', {
    method:'POST', headers: auth({ 'Content-Type':'application/json' }),
    body: JSON.stringify({ prefix: '' })
  });
  if(refus(r)) return [];
  if(!r.ok) throw new Error('liste');
  var l = await r.json();
  return Array.isArray(l) ? l : [];
}

async function texteDe(nomFichier){
  var r = await fetch(API + '/fichier/' + encodeURIComponent(nomFichier), { headers: auth() });
  if(refus(r)) throw new Error('refus');
  if(!r.ok) throw new Error('lecture ' + nomFichier);
  return decoder(await r.arrayBuffer());
}

/* Le référentiel n'est pas listé : on le lit directement. */
async function lireRef(){
  var r = await fetch(API + '/fichier/' + encodeURIComponent(FICHIER_REFS), { headers: auth() });
  if(r.status === 404){
    refAbsent = true;
    throw new Error('référentiel ICPE absent — à importer');
  }
  if(refus(r)) throw new Error('refus');
  if(!r.ok) throw new Error('lecture du référentiel');
  texteOrigine = decoder(await r.arrayBuffer());
  return texteOrigine;
}

/* Copie de l'état trouvé à l'ouverture, écrite une seule fois par
   session, juste avant la première modification. Elle permet de
   revenir en arrière si la séance de saisie a mal tourné. */
async function sauvegarder(){
  if(sauvegardeFaite || !texteOrigine) return;
  sauvegardeFaite = true;
  try {
    await fetch(API + '/fichier/' + encodeURIComponent(FICHIER_SAUVE), {
      method:'POST', headers: auth({ 'Content-Type':'text/csv' }),
      body: new Blob([texteOrigine], { type:'text/csv' })
    });
  } catch(e){ sauvegardeFaite = false; }
}

/* Retour à la copie de sécurité. */
async function restaurer(){
  if(!confirm(
      'Revenir au référentiel tel qu\'il était avant vos dernières modifications ?\n\n' +
      'Tout ce qui a été saisi depuis sera perdu.')) return;
  try {
    var r = await fetch(API + '/fichier/' + encodeURIComponent(FICHIER_SAUVE), { headers: auth() });
    if(r.status === 404){ dire('Aucune copie de sécurité disponible', 'err'); return; }
    if(refus(r)) return;
    if(!r.ok) throw new Error();
    var contenu = await r.blob();

    var w = await fetch(API + '/fichier/' + encodeURIComponent(FICHIER_REFS), {
      method:'POST', headers: auth({ 'Content-Type':'text/csv' }), body: contenu
    });
    if(refus(w)) return;
    if(!w.ok) throw new Error();
    enAttente = 0;
    dire('Référentiel restauré', 'ok');
    setTimeout(function(){ location.reload(); }, 900);
  } catch(e){
    dire('Restauration impossible', 'err');
  }
}

/* Import du référentiel, réservé à l'administration. */
async function deposerRef(champ){
  var f = champ.files && champ.files[0];
  champ.value = '';
  if(!f) return;

  var combien = Object.keys(refs).length;
  if(combien && !confirm(
      'Remplacer le référentiel entier par « ' + f.name + ' ' + '» ?\n\n' +
      combien.toLocaleString('fr-FR') + ' lignes actuelles seront écrasées, ' +
      'codes et états FDS compris.\n\n' +
      'Une copie de l\'état actuel sera conservée.')) return;

  dire('Envoi du référentiel…');
  try {
    await sauvegarder();
    var r = await fetch(API + '/fichier/' + encodeURIComponent(FICHIER_REFS), {
      method:'POST', headers: auth({ 'Content-Type':'text/csv' }), body: f
    });
    if(refus(r)) return;
    if(!r.ok) throw new Error();
    dire('Référentiel mis à jour', 'ok');
    setTimeout(function(){ location.reload(); }, 900);
  } catch(e){
    dire('Envoi impossible', 'err');
  }
}

async function chargerFDS(){
  try {
    var r = await fetch(API + '/archive', {
      method:'POST', headers: auth({ 'Content-Type':'application/json' }),
      body: JSON.stringify({ prefix: DOSSIER_FDS })
    });
    if(!r.ok) return;
    var d = await r.json();
    (d.files || []).forEach(function(f){
      var court = f.fileName.slice(DOSSIER_FDS.length);
      var m = court.match(/^(\d{8,14})[_\-\s]/) || court.match(/^(\d{8,14})\.pdf$/i);
      if(m) fiches[m[1]] = f.fileName;
    });
  } catch(e){}
}

async function charger(){
  var liste = await listerCourant();

  var ss = liste.filter(function(f){ return f.name && f.name.indexOf('StockStatus_') === 0; });
  ss.sort(function(a, b){
    return new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at);
  });
  if(!ss.length) throw new Error('aucun StockStatus dans l\'espace courant');

  var res = await Promise.all([ texteDe(ss[0].name), lireRef(), chargerFDS() ]);

  /* ── Référentiel ── */
  /* Gardé en entier : les modifications sont réécrites dans ce même
     fichier, il ne doit perdre aucune ligne au passage. */
  refs = {};
  ordreRefs = [];
  var lr = lireCSV(res[1]);
  for(var i = 1; i < lr.length; i++){
    var m = netMGB(lr[i][0]);
    if(!m || refs.hasOwnProperty(m)) continue;
    refs[m] = {
      code: (lr[i][1] || '').trim(),
      fds:  etatValide((lr[i][2] || '').trim())
    };
    ordreRefs.push(m);
  }

  /* ── Stock : regroupé par MGB ── */
  var ls = lireCSV(res[0]);
  var t = ls[0].map(function(h){ return h.trim().toLowerCase(); });
  var iM = t.indexOf('mgb'), iD = t.indexOf('description'),
      iP = t.indexOf('position'), iQ = t.indexOf('quantity');
  if(iM === -1) throw new Error('colonne MGB introuvable dans le StockStatus');

  var par = {};
  for(var j = 1; j < ls.length; j++){
    var mgb = netMGB(ls[j][iM]);
    if(!mgb) continue;
    var pos = (ls[j][iP] || '').trim();
    var a = allee(pos);
    if(!par[mgb]){
      par[mgb] = {
        mgb: mgb,
        desc: iD !== -1 ? (ls[j][iD] || '').trim() : '',
        positions: [], allees: {}, qte: 0
      };
    }
    par[mgb].positions.push(pos);
    if(a !== null) par[mgb].allees[a] = true;
    var q = parseFloat((ls[j][iQ] || '0').replace(',', '.'));
    if(!isNaN(q)) par[mgb].qte += q;
  }

  articles = Object.keys(par).map(function(m){
    var x = par[m];
    var e = refs[m] || null;              /* null = hors référentiel */
    var al = Object.keys(x.allees).map(Number).sort(function(a,b){ return a-b; });
    var secteurs = {};
    al.forEach(function(a){ secteurs[secteur(a)] = true; });
    return {
      mgb: m, desc: x.desc,
      code: e ? e.code : null,
      note: e ? e.fds : '',              /* décision saisie à la main */
      allees: al, secteurs: Object.keys(secteurs),
      nbPos: x.positions.length, position: x.positions[0] || '',
      qte: x.qte,
      pdf: !!fiches[m]                   /* fiche réellement présente en archive */
    };
  });
  articles.forEach(qualifier);

  articles.sort(function(a, b){ return a.desc.localeCompare(b.desc, 'fr'); });

  /* ── Listes déroulantes ── */
  var secs = {}, alls = {};
  articles.forEach(function(a){
    a.secteurs.forEach(function(s){ secs[s] = true; });
    a.allees.forEach(function(x){ alls[x] = true; });
  });
  listeCodes();
  remplir('f-sect', Object.keys(secs).sort(), null);
  remplir('f-allee', Object.keys(alls).map(Number).sort(function(a,b){ return a-b; }), function(a){
    return 'Allée ' + a;
  });

  var d = ss[0].name.match(/(\d{2})-(\d{2})-(\d{4})/);
  document.getElementById('accroche').textContent =
    'Stock du ' + (d ? d[1] + '/' + d[2] + '/' + d[3] : ss[0].name) +
    ' — ' + articles.length.toLocaleString('fr-FR') + ' références, ' +
    Object.keys(fiches).length + ' fiches FDS en archive.';
}

/* Un article sensible relève d'une rubrique autre que la rubrique
   générique entrepôt. Toutes n'exigent pas une FDS.

   État de la fiche, dans l'ordre de priorité :
     PRESENTE    — le PDF est en archive, l'application le constate seule
     NON REQUISE — décidé à la main, ou rubrique dispensée (alcools)
     DEMANDEE    — décidé à la main, en attente du fournisseur
     MANQUANTE   — exigée et absente
     (vide)      — produit non sensible

   Le fichier référentiel ne contient que les deux états décidés à la
   main, écrits en toutes lettres. Le reste se recalcule. */
var ETATS = {
  'PRESENTE':    { c:'ok'     },
  'MANQUANTE':   { c:'manque' },
  'DEMANDEE':    { c:'attente'},
  'NON REQUISE': { c:'rien'   },
  '':            { c:'rien'   }
};

/* États que l'on peut saisir soi-même */
var SAISISSABLES = ['MANQUANTE', 'DEMANDEE', 'NON REQUISE'];

/* « DEMANDEE » à l'écran, mais « Demandée » pour l'œil */
function joli(e){
  return { 'PRESENTE':'Présente', 'MANQUANTE':'Manquante',
           'DEMANDEE':'Demandée', 'NON REQUISE':'Non requise' }[e] || '—';
}

function etatValide(v){
  v = String(v || '').trim().toUpperCase().replace(/\s+/g, ' ');
  if(v === 'D')  v = 'DEMANDEE';      /* anciennes abréviations */
  if(v === 'NR') v = 'NON REQUISE';
  return (v === 'DEMANDEE' || v === 'NON REQUISE') ? v : '';
}

function qualifier(a){
  a.sensible = !!a.code && a.code !== CODE_GENERIQUE;

  if(a.pdf)                                a.etat = 'PRESENTE';
  else if(a.note)                          a.etat = a.note;
  else if(!a.sensible)                     a.etat = '';
  else if(SANS_FDS.indexOf(a.code) !== -1) a.etat = 'NON REQUISE';
  else                                     a.etat = 'MANQUANTE';
}

function listeCodes(){
  var codes = {};
  articles.forEach(function(a){ if(a.code) codes[a.code] = (codes[a.code] || 0) + 1; });
  var garde = document.getElementById('f-code').value;
  remplir('f-code', Object.keys(codes).sort(), function(c){
    return c + (c === CODE_GENERIQUE ? ' (générique)' : '') + ' — ' + codes[c] + ' réfs';
  });
  if(garde && codes[garde]) document.getElementById('f-code').value = garde;
}

function remplir(id, valeurs, libelle){
  var s = document.getElementById(id);
  while(s.options.length > 1) s.remove(1);
  valeurs.forEach(function(v){
    var o = document.createElement('option');
    o.value = v; o.textContent = libelle ? libelle(v) : v;
    s.appendChild(o);
  });
}

/* ══════════ AFFICHAGE ══════════ */
var ICO = '<svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5zM11 11v5h2v-5zm0 6.5v2h2v-2z"/></svg>';

function compteurs(){
  var n = function(id, v){ document.getElementById(id).textContent = v.toLocaleString('fr-FR'); };
  n('n-sensible', articles.filter(function(a){ return a.sensible; }).length);
  n('n-sansfds',  articles.filter(function(a){ return a.etat === 'MANQUANTE'; }).length);
  n('n-alcool',   articles.filter(function(a){ return a.etat === 'DEMANDEE';  }).length);
  n('n-neuf',     articles.filter(function(a){ return a.code === null; }).length);
  n('n-tous',     articles.length);
}

function vue(v){
  mode = v;
  ['sensible','sansfds','alcool','neuf','tous'].forEach(function(x){
    document.getElementById('v-' + x).classList.toggle('on', x === v);
  });
  afficher();
}

function filtrees(){
  var q = document.getElementById('rech').value.trim().toLowerCase();
  var fc = document.getElementById('f-code').value;
  var fs = document.getElementById('f-sect').value;
  var fa = document.getElementById('f-allee').value;
  var ff = document.getElementById('f-fds').value;

  return articles.filter(function(a){
    if(mode === 'sensible' && !a.sensible) return false;
    if(mode === 'sansfds' && a.etat !== 'MANQUANTE') return false;
    if(mode === 'alcool'  && a.etat !== 'DEMANDEE')  return false;
    if(mode === 'neuf' && a.code !== null) return false;
    if(ff && a.etat !== ff) return false;
    if(fc && a.code !== fc) return false;
    if(fs && a.secteurs.indexOf(fs) === -1) return false;
    if(fa && a.allees.indexOf(parseInt(fa, 10)) === -1) return false;
    if(q && a.mgb.indexOf(q) === -1 && a.desc.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function afficher(){
  var l = filtrees();
  var zone = document.getElementById('liste');

  if(!l.length){
    zone.innerHTML = '<div class="info">Aucune référence pour cette sélection.</div>';
    return;
  }

  zone.innerHTML = '<div class="ligne tete"><span>MGB</span><span>Désignation</span>' +
    '<span>Code</span><span>Secteur</span><span>Emplacement</span>' +
    '<span style="text-align:right">FDS</span></div>';

  l.slice(0, MAX_LIGNES).forEach(function(a){
    var d = document.createElement('div');
    d.className = 'ligne';
    d.innerHTML = '<span class="mgb"></span><span class="lib"></span>' +
      '<span class="c"></span><span class="pos s"></span><span class="pos p"></span>' +
      '<span style="text-align:right" class="f"></span>';

    d.querySelector('.mgb').textContent = a.mgb;
    d.querySelector('.lib').textContent = a.desc || '—';
    d.querySelector('.lib').title = a.desc;

    var c = document.createElement(peutEditer ? 'button' : 'span');
    if(a.code === null){ c.className = 'code neuf'; c.textContent = 'inconnu'; }
    else if(!a.code){ c.className = 'code aucun'; c.textContent = 'aucun'; }
    else { c.className = 'code' + (a.sensible ? ' sensible' : ''); c.textContent = a.code; }
    if(peutEditer){
      c.className += ' modifiable';
      c.title = 'Modifier le code ICPE';
      c.onclick = function(){ editer(a, c); };
    }
    d.querySelector('.c').appendChild(c);

    d.querySelector('.s').textContent = a.secteurs.join(', ') || '—';
    d.querySelector('.p').textContent = a.position + (a.nbPos > 1 ? ' +' + (a.nbPos - 1) : '');

    var f = d.querySelector('.f');
    if(a.etat === 'PRESENTE'){
      var b = document.createElement('button');
      b.className = 'fds'; b.innerHTML = ICO + 'FDS';
      b.title = 'Ouvrir la fiche';
      b.onclick = function(){ ouvrir(a); };
      f.appendChild(b);
    }
    else if(peutEditer && (a.sensible || a.note)){
      var s = document.createElement('select');
      s.className = 'etat ' + ETATS[a.etat].c;
      SAISISSABLES.forEach(function(e){
        var op = document.createElement('option');
        op.value = e; op.textContent = joli(e);
        if(e === a.etat) op.selected = true;
        s.appendChild(op);
      });
      s.onchange = function(){ changerEtat(a, s.value); };
      f.appendChild(s);
    }
    else {
      var r = document.createElement('span');
      r.className = a.etat === 'MANQUANTE' ? 'manque' : 'rien';
      r.textContent = a.etat ? (a.etat === 'MANQUANTE' ? 'MANQUANTE' : joli(a.etat)) : '—';
      f.appendChild(r);
    }
    zone.appendChild(d);
  });

  if(l.length > MAX_LIGNES){
    var p = document.createElement('div');
    p.className = 'plus';
    p.textContent = (l.length - MAX_LIGNES).toLocaleString('fr-FR') +
      ' références de plus — affinez la sélection ou exportez.';
    zone.appendChild(p);
  }
}

['rech','f-code','f-sect','f-allee','f-fds'].forEach(function(id){
  document.getElementById(id).addEventListener(id === 'rech' ? 'input' : 'change', afficher);
});

/* ══════════ MODIFICATION DU RÉFÉRENTIEL ══════════ */
/* Le code se change d'un clic dans la liste. Le fichier est réécrit
   tout seul une seconde après la dernière retouche. */
var minuteur = null, enAttente = 0;

function editer(a, chip){
  var actuel = a.code === null ? '' : a.code;
  var saisi = prompt(
    a.desc + '\nMGB ' + a.mgb +
    '\n\nCode ICPE — vide pour « aucun », « x » pour retirer du référentiel :',
    actuel);
  if(saisi === null) return;

  saisi = saisi.trim().toUpperCase();
  var nouveau = (saisi === 'X') ? null : saisi;
  if(nouveau === a.code) return;

  a.code = nouveau;
  if(nouveau === null){ delete refs[a.mgb]; a.note = ''; }
  else inscrire(a);
  appliquer(a);
}

/* Changement d'état de la fiche, depuis la colonne FDS */
function changerEtat(a, etat){
  a.note = etatValide(etat);
  if(a.code === null && a.note){ a.code = ''; }   /* il faut une ligne pour la garder */
  if(a.code !== null) inscrire(a);
  appliquer(a);
}

function inscrire(a){
  if(!refs.hasOwnProperty(a.mgb)) ordreRefs.push(a.mgb);
  refs[a.mgb] = { code: a.code || '', fds: a.note || '' };
}

function appliquer(a){
  qualifier(a);
  enAttente++;
  compteurs();
  listeCodes();
  afficher();
  if(minuteur) clearTimeout(minuteur);
  minuteur = setTimeout(enregistrerRef, 1000);
}

async function enregistrerRef(){
  var nb = enAttente;
  await sauvegarder();
  var lignes = ['MGB;CODE;FDS'];
  ordreRefs.forEach(function(m){
    var e = refs[m];
    if(e) lignes.push(m + ';' + (e.code || '') + ';' + (e.fds || ''));
  });
  var csv = lignes.join('\r\n') + '\r\n';

  try {
    var r = await fetch(API + '/fichier/' + encodeURIComponent(FICHIER_REFS), {
      method:'POST', headers: auth({ 'Content-Type':'text/csv' }),
      body: new Blob([csv], { type:'text/csv' })
    });
    if(refus(r)) return;
    if(!r.ok) throw new Error();
    enAttente -= nb;
    dire(nb + (nb > 1 ? ' codes enregistrés' : ' code enregistré'), 'ok');
  } catch(e){
    dire('Enregistrement impossible — vos modifications ne sont pas sauvegardées', 'err');
  }
}

window.addEventListener('beforeunload', function(e){
  if(enAttente){ e.preventDefault(); e.returnValue = ''; }
});

/* ══════════ EXPORT ══════════ */
function exporter(){
  var l = filtrees();
  if(!l.length){ dire('Rien à exporter', 'err'); return; }

  var lignes = [['MGB','Designation','Code ICPE','Secteur','Allees','Emplacements','Quantite','Etat FDS']];
  l.forEach(function(a){
    lignes.push([a.mgb, a.desc,
      a.code === null ? 'HORS REFERENTIEL' : (a.code || 'AUCUN'),
      a.secteurs.join(' / '), a.allees.join(' '),
      a.nbPos, String(a.qte).replace('.', ','),
      a.etat || 'SANS OBJET']);
  });

  var csv = lignes.map(function(r){
    return r.map(function(v){
      v = String(v);
      return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(';');
  }).join('\r\n');

  var b = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' });
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u;
  a.download = 'ICPE_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(u);
  dire(l.length + ' références exportées', 'ok');
}

/* ══════════ LECTEUR FDS ══════════ */
var urlCourante = null;

async function ouvrir(a){
  document.getElementById('l-nom').textContent = a.desc || a.mgb;
  document.getElementById('l-mgb').textContent = 'MGB ' + a.mgb;
  document.getElementById('l-attente').style.display = 'flex';
  document.getElementById('l-attente').textContent = 'Ouverture…';
  document.getElementById('l-cadre').style.display = 'none';
  document.getElementById('voile').classList.add('on');
  try {
    var r = await fetch(API + '/archive/' + encodeURIComponent(fiches[a.mgb]), { headers: auth() });
    if(refus(r)) return;
    if(!r.ok) throw new Error();
    var b = new Blob([await r.blob()], { type:'application/pdf' });
    if(urlCourante) URL.revokeObjectURL(urlCourante);
    urlCourante = URL.createObjectURL(b);
    var cadre = document.getElementById('l-cadre');
    cadre.src = urlCourante; cadre.style.display = 'block';
    document.getElementById('l-attente').style.display = 'none';
    document.getElementById('l-tel').onclick = function(){
      var x = document.createElement('a');
      x.href = urlCourante; x.download = 'FDS_' + a.mgb + '.pdf'; x.click();
    };
  } catch(e){
    document.getElementById('l-attente').textContent = 'Impossible d\'ouvrir la fiche.';
  }
}
function fermerLecteur(){
  document.getElementById('voile').classList.remove('on');
  document.getElementById('l-cadre').src = 'about:blank';
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') fermerLecteur(); });

/* ══════════ DÉMARRAGE ══════════ */
(async function(){
  if(!jeton) return;
  try {
    await charger();
    compteurs();
    vue('sensible');
  } catch(e){
    document.getElementById('accroche').textContent = 'Chargement impossible — ' + (e.message || '') + '.';

    /* Premier démarrage : c'est le seul moment où l'import est proposé. */
    if(peutEditer && refAbsent) document.getElementById('b-ref').style.display = 'inline-flex';

    document.getElementById('liste').innerHTML =
      '<div class="info">' + (peutEditer && refAbsent
        ? 'Importez le référentiel ICPE avec le bouton « Référentiel ».'
        : 'Vérifiez qu\'un StockStatus est présent dans l\'espace courant.') + '</div>';
  }
})();
