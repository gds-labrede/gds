<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDS — Test de connexion</title>
<style>
body{font-family:system-ui,sans-serif;background:#eef1f6;color:#16203a;margin:0;padding:28px}
.col{max-width:760px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
p.s{font-size:13px;color:#5c6883;margin:0 0 20px}
.b{background:#fff;border:1px solid #e2e7ef;border-radius:12px;padding:18px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:#5c6883;margin-bottom:5px}
input{width:100%;padding:11px 13px;border:1px solid #e2e7ef;border-radius:9px;font-size:14px;margin-bottom:12px}
button{padding:12px 20px;border:none;border-radius:9px;background:#1a2e55;color:#fff;
  font-size:14px;font-weight:700;cursor:pointer}
pre{background:#0d1526;color:#d7e3f5;padding:14px;border-radius:10px;font-size:12px;
  white-space:pre-wrap;word-break:break-all;margin:0}
.t{font-size:13px;font-weight:700;margin-bottom:8px}
</style>
</head>
<body>
<div class="col">
  <h1>Test de connexion</h1>
  <p class="s">Cette page affiche la cause exacte de l'échec. Elle ne remplace pas l'application.</p>

  <div class="b">
    <div class="t">1. Configuration lue</div>
    <pre id="cfg">…</pre>
  </div>

  <div class="b">
    <div class="t">2. Essai de connexion</div>
    <label>Identifiant</label>
    <input type="text" id="id" value="poy59" autocapitalize="none" spellcheck="false">
    <label>Mot de passe</label>
    <input type="text" id="pw" placeholder="en clair, pour vérifier la saisie">
    <button onclick="essai()">Tester</button>
  </div>

  <div class="b">
    <div class="t">3. Résultat</div>
    <pre id="res">En attente…</pre>
  </div>
</div>

<script src="config.js"></script>
<script>
var cfg = document.getElementById('cfg');
var res = document.getElementById('res');

if (typeof GDS === 'undefined') {
  cfg.textContent = 'ERREUR : config.js absent ou illisible.';
} else {
  cfg.textContent =
    'API          : ' + (GDS.API || '(vide)') + '\n' +
    'CLE_PUBLIQUE : ' + (GDS.CLE_PUBLIQUE || '(vide)').slice(0, 18) + '…  (' +
      (GDS.CLE_PUBLIQUE || '').length + ' caractères)' + '\n' +
    'Clé à remplacer ? ' + ((GDS.CLE_PUBLIQUE || '').indexOf('A_REMPLACER') !== -1 ? 'OUI — problème' : 'non') + '\n' +
    'sessionStorage   : ' + testStockage();
}

function testStockage(){
  try { sessionStorage.setItem('t','1'); sessionStorage.removeItem('t'); return 'disponible'; }
  catch(e){ return 'BLOQUÉ par le navigateur — problème'; }
}

async function essai(){
  res.textContent = 'Appel en cours…';
  var id = document.getElementById('id').value.trim();
  var pw = document.getElementById('pw').value;

  try {
    var r = await fetch(GDS.API + '/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + GDS.CLE_PUBLIQUE,
        'apikey': GDS.CLE_PUBLIQUE
      },
      body: JSON.stringify({ id: id, pw: pw })
    });
    var texte = await r.text();
    res.textContent =
      'Statut HTTP : ' + r.status + '\n' +
      'Réponse     : ' + texte.slice(0, 500);
  } catch(e){
    res.textContent =
      'L\'appel n\'a pas abouti (réseau, CORS ou origine non autorisée).\n\n' +
      'Détail : ' + (e && e.message ? e.message : e);
  }
}
</script>
</body>
</html>
