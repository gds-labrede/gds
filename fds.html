<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDS — Fiches FDS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --white:#fff;
  --border:#e2e7ef; --border-hi:#c9d2e0;
  --text:#16203a; --text-mid:#5c6883; --text-low:#98a1b5;
  --navy:#1a2e55; --orange:#c2701c; --rouge:#b8342f; --vert:#1d7a5f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ══ BARRE ══ */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;
  padding:0 32px;height:60px;background:var(--white);
  border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(20,32,60,.07)}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-size:18px;font-weight:700;letter-spacing:-.4px}
.logo span{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text-low)}
.sp{flex:1}
.lien{display:inline-flex;align-items:center;gap:7px;background:var(--white);
  border:1px solid var(--border);border-radius:8px;padding:8px 13px;color:var(--text-mid);
  font-family:'DM Sans',sans-serif;font-size:12.5px;text-decoration:none;cursor:pointer;
  transition:border-color .18s,color .18s}
.lien:hover{border-color:var(--border-hi);color:var(--text)}
.pastille{width:33px;height:33px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#2a4576,var(--navy));color:#fff;font-size:12px;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}

/* ══ PAGE ══ */
.page{max-width:1320px;margin:0 auto;padding:30px 32px 60px}
h1{font-size:25px;font-weight:700;letter-spacing:-.5px}
.accroche{font-size:13.5px;color:var(--text-mid);margin-top:5px;margin-bottom:20px}
.vue{display:none}
.vue.on{display:block}

/* ══ SEGMENTS ══ */
.segments{display:inline-flex;gap:3px;padding:3px;background:var(--white);
  border:1px solid var(--border);border-radius:10px;margin-bottom:18px;
  box-shadow:0 1px 2px rgba(20,32,60,.05)}
.seg{border:none;background:transparent;padding:9px 16px;border-radius:8px;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;color:var(--text-low);
  transition:background .18s,color .18s}
.seg:hover{color:var(--text-mid)}
.seg.on{background:var(--navy);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}

/* ══ RECHERCHE ══ */
.recherche{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--text);background:var(--white);
  outline:none;margin-bottom:14px;transition:border-color .18s}
.recherche:focus{border-color:var(--navy)}

/* ══ LISTE ══ */
.liste{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,32,60,.05)}
.ligne{display:grid;grid-template-columns:130px 1fr 190px 160px;gap:14px;align-items:center;
  padding:11px 16px;border-top:1px solid var(--border);font-size:13px}
.ligne:first-child{border-top:none}
.ligne.tete{background:#f7f9fc;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:1.4px;
  color:var(--text-low);text-transform:uppercase;padding:10px 16px}
.ligne:not(.tete):hover{background:#fafbfd}
.mgb{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-mid)}
.lib{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--text-low)}
.act{display:flex;gap:6px;justify-content:flex-end}

.ouvrir{display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
  padding:7px 13px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;
  color:#fff;background:linear-gradient(180deg,#d45c55,var(--rouge));
  box-shadow:0 6px 14px -8px rgba(184,52,47,.9),inset 0 1px 0 rgba(255,255,255,.3);
  transition:filter .18s,transform .1s}
.ouvrir:hover{filter:brightness(1.08)}
.ouvrir:active{transform:translateY(1px)}
.ouvrir svg{width:14px;height:14px;fill:#fff}
.mini{background:var(--white);border:1px solid var(--border);border-radius:7px;padding:6px 10px;
  font-family:'DM Sans',sans-serif;font-size:11.5px;color:var(--text-mid);cursor:pointer;
  transition:border-color .16s,color .16s,background .16s}
.mini:hover{border-color:var(--navy);color:var(--navy)}
.mini.sup:hover{border-color:var(--rouge);color:var(--rouge);background:#fdf4f4}
.mini:disabled{opacity:.5;cursor:default}
.outils{display:flex;gap:10px;align-items:flex-start}
.outils .recherche{flex:1}
.tout{white-space:nowrap;padding:11px 16px;border:1px solid rgba(255,255,255,.16);border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#2a4576,var(--navy));color:#fff;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
  box-shadow:0 8px 20px -12px rgba(26,46,85,.9),inset 0 1px 0 rgba(255,255,255,.25);
  transition:filter .18s,transform .1s}
.tout:hover:not(:disabled){filter:brightness(1.12)}
.tout:disabled{opacity:.55;cursor:default}
.info{padding:34px;text-align:center;color:var(--text-low);font-size:13px}
.plus{padding:12px;text-align:center;color:var(--text-low);font-size:12px;border-top:1px solid var(--border)}

/* ══ DÉPÔT EN LOT ══ */
.zone{background:linear-gradient(180deg,#fff,#fbfcfe);border:2px dashed var(--border-hi);
  border-radius:14px;padding:30px 22px;text-align:center;cursor:pointer;margin-bottom:18px;
  transition:border-color .2s,background .2s}
.zone:hover{border-color:var(--navy);background:#f7f9fd}
.zone svg{width:44px;height:44px;margin-bottom:10px}
.zone .a{fill:#cbd8ea}.zone .b{fill:var(--navy)}
.zone-t{font-size:14.5px;font-weight:600}
.zone-s{font-size:12px;color:var(--text-mid);margin-top:4px}

.bilan{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.bil{background:linear-gradient(180deg,#fff,#fbfcfe);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,32,60,.05),inset 0 1px 0 #fff}
.bil-v{font-size:23px;font-weight:700;letter-spacing:-.6px}
.bil-l{font-size:12px;color:var(--text-mid);margin-top:2px}
.bil.envoi .bil-v{color:var(--navy)}
.bil.ajour .bil-v{color:var(--vert)}
.bil.hors  .bil-v{color:var(--text-low)}

.go{padding:12px 22px;border:1px solid rgba(255,255,255,.16);border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#f0913f,#d46c1a);color:#fff;
  font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:700;
  box-shadow:0 8px 20px -10px rgba(212,108,26,.9),inset 0 1px 0 rgba(255,255,255,.35);
  transition:filter .18s,transform .1s}
.go:hover:not(:disabled){filter:brightness(1.07)}
.go:active:not(:disabled){transform:translateY(1px)}
.go:disabled{opacity:.5;cursor:default}
.barre-h{margin:16px 0;display:none}
.barre-h.on{display:block}
.barre-t{font-size:12.5px;color:var(--text-mid);margin-bottom:8px}
.barre-p{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(20,32,60,.08)}
.barre-b{height:100%;width:0;border-radius:4px;transition:width .25s;
  background:linear-gradient(90deg,#2d5a9e,#3f7fd4)}

.etat{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:1.1px;font-weight:600;
  padding:4px 8px;border-radius:5px;white-space:nowrap}
.etat.envoi{background:#eaf1fb;color:#2d5a9e;border:1px solid #cfe0f5}
.etat.ajour{background:#e9f7f1;color:var(--vert);border:1px solid #bde5d5}
.etat.hors {background:var(--bg);color:var(--text-low);border:1px solid var(--border)}
.etat.ok   {background:#e9f7f1;color:var(--vert);border:1px solid #bde5d5}
.etat.ko   {background:#fdeaea;color:var(--rouge);border:1px solid #f2c2c2}
.l2{grid-template-columns:130px 1fr 150px 120px}

/* ══ LECTEUR ══ */
.voile{position:fixed;inset:0;z-index:50;background:rgba(14,22,42,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:24px}
.voile.on{display:flex}
.lecteur{width:min(1100px,100%);height:min(92vh,1200px);background:var(--white);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.lect-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#fff,#f7f9fc)}
.lect-t{flex:1;min-width:0}
.lect-nom{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lect-mgb{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-low);margin-top:2px}
.lecteur iframe{flex:1;border:none;background:#525659}
.lect-attente{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-low);font-size:13px}

/* ══ MESSAGES ══ */
.toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{background:var(--navy);color:#fff;padding:12px 17px;border-radius:10px;font-size:13px;
  box-shadow:0 10px 30px -8px rgba(20,32,60,.5);animation:entre .28s cubic-bezier(.2,.8,.3,1)}
.toast.ok{background:linear-gradient(180deg,#22916f,#1d7a5f)}
.toast.err{background:linear-gradient(180deg,#c44540,#b8342f)}
@keyframes entre{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

*:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:820px){
  .bar{padding:0 16px}
  .page{padding:22px 16px 44px}
  .ligne,.l2{grid-template-columns:1fr auto}
  .ligne .mgb,.ligne .meta{display:none}
  .ligne.tete{display:none}
}
</style>
</head>
<body>

<header class="bar">
  <div class="logo"><b>GDS</b><span>LA BRÈDE</span></div>
  <div class="sp"></div>
  <a class="lien" href="sommaire.html#danger">← Tableau de bord</a>
  <div class="pastille" id="pastille">–</div>
</header>

<main class="page">
  <h1>Fiches de données de sécurité</h1>
  <p class="accroche" id="accroche">Chargement…</p>

  <div class="segments">
    <button class="seg on" data-v="biblio" onclick="vue('biblio')">Fiches</button>
    <button class="seg" data-v="depot" onclick="vue('depot')" id="seg-depot" style="display:none">Dépôt en lot</button>
  </div>

  <!-- ══ BIBLIOTHÈQUE ══ -->
  <div class="vue on" id="v-biblio">
    <div class="outils">
      <input type="text" class="recherche" id="rech" placeholder="Rechercher un MGB ou une désignation…">
      <button class="tout" id="b-tout" onclick="toutTelecharger()">Tout télécharger</button>
    </div>
    <div class="liste" id="liste"><div class="info">Chargement…</div></div>
  </div>

  <!-- ══ DÉPÔT EN LOT ══ -->
  <div class="vue" id="v-depot">
    <div class="zone" onclick="document.getElementById('dossier').click()">
      <svg viewBox="0 0 48 48">
        <path class="a" d="M4 12a3 3 0 0 1 3-3h11l4 5h19a3 3 0 0 1 3 3v19a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/>
        <path class="b" d="M24 17l-8 8h5v10h6V25h5z"/>
      </svg>
      <div class="zone-t">Choisir le dossier des FDS</div>
      <div class="zone-s">Tous les PDF du dossier sont comparés à l'archive. Rien n'est envoyé avant votre validation.</div>
      <input type="file" id="dossier" webkitdirectory directory multiple style="display:none">
    </div>

    <div id="apres" style="display:none">
      <div class="bilan">
        <div class="bil envoi"><div class="bil-v" id="n-envoi">0</div><div class="bil-l">À envoyer</div></div>
        <div class="bil ajour"><div class="bil-v" id="n-ajour">0</div><div class="bil-l">Déjà à jour</div></div>
        <div class="bil hors"><div class="bil-v" id="n-hors">0</div><div class="bil-l">Ignorés</div></div>
      </div>

      <button class="go" id="b-envoi" onclick="envoyerLot()">Envoyer les fiches</button>

      <div class="barre-h" id="barre-h">
        <div class="barre-t" id="barre-t">—</div>
        <div class="barre-p"><div class="barre-b" id="barre-b"></div></div>
      </div>

      <div class="liste" id="liste-lot" style="margin-top:16px"></div>
    </div>
  </div>
</main>

<div class="voile" id="voile" onclick="if(event.target===this) fermerLecteur()">
  <div class="lecteur">
    <div class="lect-h">
      <div class="lect-t">
        <div class="lect-nom" id="l-nom">—</div>
        <div class="lect-mgb" id="l-mgb">—</div>
      </div>
      <button class="mini" id="l-tel">Télécharger</button>
      <button class="mini" onclick="fermerLecteur()">Fermer</button>
    </div>
    <div class="lect-attente" id="l-attente">Ouverture de la fiche…</div>
    <iframe id="l-cadre" title="Fiche de données de sécurité" style="display:none"></iframe>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>window.JSZip || document.write('<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"><\/script>');</script>
<script src="config.js"></script>
<script>
if (typeof GDS === 'undefined') {
  document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px">Fichier config.js absent.</p>';
  throw new Error('config.js absent');
}

var API          = GDS.API;
var CLE_PUBLIQUE = GDS.CLE_PUBLIQUE;

/* Les fiches vivent dans le dossier FDS/ de l'archive.
   Le nom du fichier est conservé tel quel : le MGB est en tête,
   la désignation suit — rien à renommer, rien à saisir. */
var DOSSIER = 'FDS/';
var MAX_LIGNES = 400;
var EN_PARALLELE = 3;

/* ══════════ SESSION ══════════ */
function lire(c){
  try { return sessionStorage.getItem(c) || localStorage.getItem(c); }
  catch(e){ return null; }
}

var jeton = lire('gds_jeton');
var role  = lire('gds_role');
var nom   = lire('gds_nom');
if(!jeton){ location.replace('index.html'); }

var peutDeposer = role === 'admin' || role === 'admin_restreint';
if(peutDeposer) document.getElementById('seg-depot').style.display = 'block';

document.getElementById('pastille').textContent =
  (nom || '?').split(' ').map(function(m){ return m[0]; }).join('').slice(0,2).toUpperCase();

function auth(sup){
  var h = { 'Authorization':'Bearer ' + CLE_PUBLIQUE, 'apikey':CLE_PUBLIQUE, 'X-GDS-Session':jeton };
  if(sup) for(var k in sup) h[k] = sup[k];
  return h;
}

function dire(texte, type){
  var d = document.createElement('div');
  d.className = 'toast' + (type ? ' ' + type : '');
  d.textContent = texte;
  document.getElementById('toasts').appendChild(d);
  setTimeout(function(){ d.remove(); }, 3600);
}

/* Un refus du serveur ne doit jamais effacer la session :
   on le signale, l'utilisateur reste connecté. */
function refus(r){
  if(r.status === 401 || r.status === 403){
    dire('Accès refusé par le serveur (' + r.status + ')', 'err');
    return true;
  }
  return false;
}

function poids(o){
  if(o < 1024) return o + ' o';
  if(o < 1048576) return (o / 1024).toFixed(0) + ' Ko';
  return (o / 1048576).toFixed(1) + ' Mo';
}

/* Un nom de fichier → son MGB et son libellé.
   387544001001_METRO_PROFESSIONAL_Nettoyant_sol.pdf
   → mgb 387544001001, libellé « METRO PROFESSIONAL Nettoyant sol » */
function decouper(nomFichier){
  var base = nomFichier.replace(/\.pdf$/i, '');
  var m = base.match(/^(\d{8,14})[_\-\s](.*)$/);
  if(!m) return null;
  return { mgb: m[1], libelle: m[2].replace(/[_]+/g, ' ').trim() };
}

function vue(v){
  document.querySelectorAll('.seg').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
  document.querySelectorAll('.vue').forEach(function(d){ d.classList.toggle('on', d.id === 'v-' + v); });
}

/* ══════════ BIBLIOTHÈQUE ══════════ */
var fiches = [];   /* { nomFichier, mgb, libelle, taille, date } */

async function chargerFiches(){
  var r = await fetch(API + '/archive', {
    method:'POST', headers: auth({ 'Content-Type':'application/json' }),
    body: JSON.stringify({ prefix: DOSSIER })
  });
  if(refus(r)) return;
  if(!r.ok) throw new Error('archive');
  var d = await r.json();

  fiches = (d.files || []).filter(function(f){ return /\.pdf$/i.test(f.fileName); })
    .map(function(f){
      var court = f.fileName.slice(DOSSIER.length);
      var c = decouper(court) || { mgb:'—', libelle: court.replace(/\.pdf$/i,'') };
      return { nomFichier: f.fileName, mgb: c.mgb, libelle: c.libelle,
               taille: f.contentLength || 0, date: f.uploadTimestamp || null };
    });
  fiches.sort(function(a, b){ return a.libelle.localeCompare(b.libelle, 'fr'); });
}

var ICO = '<svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5zM11 11v5h2v-5zm0 6.5v2h2v-2z"/></svg>';

function accroche(){
  var total = fiches.reduce(function(s, f){ return s + f.taille; }, 0);
  document.getElementById('accroche').textContent =
    fiches.length + ' fiche' + (fiches.length > 1 ? 's' : '') + ' dans l\'archive · ' + poids(total) +
    (peutDeposer ? ' · déposez un dossier complet depuis l\'onglet Dépôt en lot.' : '');
}

function filtrees(){
  var q = document.getElementById('rech').value.trim().toLowerCase();
  return fiches.filter(function(f){
    return !q || f.mgb.indexOf(q) !== -1 || f.libelle.toLowerCase().indexOf(q) !== -1;
  });
}

var zipEnCours = false;
function majBoutonTout(n){
  if(zipEnCours) return;
  var b = document.getElementById('b-tout');
  b.disabled = n === 0;
  b.textContent = document.getElementById('rech').value.trim()
    ? 'Télécharger (' + n + ')' : 'Tout télécharger (' + n + ')';
}

function afficher(){
  var l = filtrees();
  majBoutonTout(l.length);

  var zone = document.getElementById('liste');
  if(!l.length){
    zone.innerHTML = '<div class="info">' +
      (fiches.length ? 'Aucune fiche pour cette recherche.' : 'Archive vide — déposez vos FDS.') + '</div>';
    return;
  }

  zone.innerHTML = '<div class="ligne tete"><span>MGB</span><span>Désignation</span>' +
                   '<span>Déposée le</span><span style="text-align:right">Fiche</span></div>';

  l.slice(0, MAX_LIGNES).forEach(function(f){
    var d = document.createElement('div');
    d.className = 'ligne';
    d.innerHTML = '<span class="mgb"></span><span class="lib"></span><span class="meta"></span><span class="act"></span>';
    d.querySelector('.mgb').textContent = f.mgb;
    d.querySelector('.lib').textContent = f.libelle;
    d.querySelector('.lib').title       = f.libelle;
    d.querySelector('.meta').textContent =
      (f.date ? new Date(f.date).toLocaleDateString('fr-FR') : '—') + ' · ' + poids(f.taille);

    var act = d.querySelector('.act');
    var b = document.createElement('button');
    b.className = 'ouvrir'; b.innerHTML = ICO + 'Ouvrir';
    b.onclick = function(){ ouvrir(f); };
    act.appendChild(b);

    if(role === 'admin'){
      var s = document.createElement('button');
      s.className = 'mini sup'; s.textContent = 'Supprimer';
      s.onclick = function(){ supprimer(f, s); };
      act.appendChild(s);
    }
    zone.appendChild(d);
  });

  if(l.length > MAX_LIGNES){
    var p = document.createElement('div');
    p.className = 'plus';
    p.textContent = (l.length - MAX_LIGNES) + ' fiches de plus — affinez la recherche.';
    zone.appendChild(p);
  }
}

document.getElementById('rech').addEventListener('input', afficher);

/* ══════════ TOUT TÉLÉCHARGER ══════════
   Récupère toutes les fiches affichées (recherche comprise)
   et les livre dans un seul fichier ZIP. */
async function toutTelecharger(){
  var l = filtrees();
  if(!l.length || zipEnCours) return;
  if(!window.JSZip){ dire('Module ZIP indisponible', 'err'); return; }
  if(!confirm('Télécharger ' + l.length + ' fiche' + (l.length > 1 ? 's' : '') +
              ' dans un fichier ZIP ?')) return;

  zipEnCours = true;
  var b = document.getElementById('b-tout');
  b.disabled = true;
  var zip = new JSZip(), faits = 0, echecs = [], suivant = 0;

  function avance(){ b.textContent = 'Téléchargement… ' + faits + ' / ' + l.length; }
  avance();

  async function fil(){
    while(suivant < l.length){
      var f = l[suivant++];
      try {
        var r = await fetch(API + '/archive/' + encodeURIComponent(f.nomFichier), { headers: auth() });
        if(r.status === 401 || r.status === 403) throw new Error('refus');
        if(!r.ok) throw new Error();
        zip.file(f.nomFichier.slice(DOSSIER.length), await r.blob());
      } catch(e){ echecs.push(f.nomFichier.slice(DOSSIER.length)); }
      faits++; avance();
    }
  }

  try {
    var fils = [];
    for(var k = 0; k < Math.min(EN_PARALLELE, l.length); k++) fils.push(fil());
    await Promise.all(fils);

    if(echecs.length === l.length) throw new Error();
    if(echecs.length) zip.file('_FICHES_NON_RECUPEREES.txt', echecs.join('\r\n'));

    b.textContent = 'Préparation du ZIP…';
    var z = await zip.generateAsync({ type:'blob' });
    var d = new Date();
    var x = document.createElement('a');
    x.href = URL.createObjectURL(z);
    x.download = 'FDS_' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') +
                 String(d.getDate()).padStart(2,'0') + '.zip';
    x.click();
    setTimeout(function(){ URL.revokeObjectURL(x.href); }, 10000);

    dire(echecs.length ? (l.length - echecs.length) + ' fiches téléchargées, ' + echecs.length + ' en échec'
                       : l.length + ' fiches téléchargées', echecs.length ? 'err' : 'ok');
  } catch(e){
    dire('Téléchargement impossible', 'err');
  }
  zipEnCours = false;
  majBoutonTout(filtrees().length);
}

/* ══════════ LECTEUR ══════════ */
var urlCourante = null;

async function ouvrir(f){
  document.getElementById('l-nom').textContent = f.libelle;
  document.getElementById('l-mgb').textContent = 'MGB ' + f.mgb;
  document.getElementById('l-attente').style.display = 'flex';
  document.getElementById('l-attente').textContent = 'Ouverture de la fiche…';
  document.getElementById('l-cadre').style.display = 'none';
  document.getElementById('voile').classList.add('on');

  try {
    var r = await fetch(API + '/archive/' + encodeURIComponent(f.nomFichier), { headers: auth() });
    if(refus(r)) return;
    if(!r.ok) throw new Error();
    var b = new Blob([await r.blob()], { type:'application/pdf' });
    if(urlCourante) URL.revokeObjectURL(urlCourante);
    urlCourante = URL.createObjectURL(b);

    var cadre = document.getElementById('l-cadre');
    cadre.src = urlCourante;
    cadre.style.display = 'block';
    document.getElementById('l-attente').style.display = 'none';

    document.getElementById('l-tel').onclick = function(){
      var x = document.createElement('a');
      x.href = urlCourante;
      x.download = f.nomFichier.slice(DOSSIER.length);
      x.click();
    };
  } catch(e){
    document.getElementById('l-attente').textContent = 'Impossible d\'ouvrir la fiche.';
  }
}

function fermerLecteur(){
  document.getElementById('voile').classList.remove('on');
  document.getElementById('l-cadre').src = 'about:blank';
}

document.addEventListener('keydown', function(e){ if(e.key === 'Escape') fermerLecteur(); });

async function supprimer(f, bouton){
  if(!confirm('Supprimer définitivement la fiche « ' + f.libelle + ' » ?')) return;
  bouton.disabled = true; bouton.textContent = '…';
  try {
    var r = await fetch(API + '/archive/' + encodeURIComponent(f.nomFichier),
                        { method:'DELETE', headers: auth() });
    if(refus(r)) return;
    if(!r.ok) throw new Error();
    dire('Fiche supprimée', 'ok');
    await chargerFiches(); accroche(); afficher();
  } catch(e){
    bouton.disabled = false; bouton.textContent = 'Supprimer';
    dire('Suppression impossible', 'err');
  }
}

/* ══════════ DÉPÔT EN LOT ══════════ */
var lot = [];   /* { fichier, mgb, libelle, etat, existant } */

document.getElementById('dossier').addEventListener('change', function(e){
  analyser(Array.prototype.slice.call(e.target.files));
  e.target.value = '';
});

function analyser(fichiers){
  var pdf = fichiers.filter(function(f){
    return /\.pdf$/i.test(f.name) && f.name.indexOf('.') !== 0;
  });

  /* Pour chaque MGB, la fiche déjà en ligne (s'il y en a une) */
  var parMGB = {};
  fiches.forEach(function(f){ parMGB[f.mgb] = f; });

  lot = pdf.map(function(f){
    var c = decouper(f.name);
    if(!c) return { fichier:f, mgb:'—', libelle:f.name, etat:'hors',
                    raison:'MGB absent du nom' };

    var e = parMGB[c.mgb];
    if(!e) return { fichier:f, mgb:c.mgb, libelle:c.libelle, etat:'envoi', raison:'Nouvelle' };

    /* Marge d'une minute : les copies de fichiers décalent l'horodatage */
    if(f.lastModified > (e.date || 0) + 60000)
      return { fichier:f, mgb:c.mgb, libelle:c.libelle, etat:'envoi',
               raison:'Plus récente', existant:e };

    return { fichier:f, mgb:c.mgb, libelle:c.libelle, etat:'ajour', raison:'Déjà à jour', existant:e };
  });

  lot.sort(function(a, b){
    var o = { envoi:0, ajour:1, hors:2 };
    return (o[a.etat] - o[b.etat]) || a.libelle.localeCompare(b.libelle, 'fr');
  });

  document.getElementById('apres').style.display = 'block';
  document.getElementById('barre-h').classList.remove('on');
  majBilan();
  afficherLot();

  if(!pdf.length) dire('Aucun PDF trouvé dans ce dossier', 'err');
}

function majBilan(){
  var c = { envoi:0, ajour:0, hors:0 };
  lot.forEach(function(x){ if(c[x.etat] !== undefined) c[x.etat]++; });
  document.getElementById('n-envoi').textContent = c.envoi;
  document.getElementById('n-ajour').textContent = c.ajour;
  document.getElementById('n-hors').textContent  = c.hors;

  var b = document.getElementById('b-envoi');
  b.disabled = c.envoi === 0;
  b.textContent = c.envoi ? 'Envoyer ' + c.envoi + ' fiche' + (c.envoi > 1 ? 's' : '') : 'Rien à envoyer';
}

function afficherLot(){
  var zone = document.getElementById('liste-lot');
  zone.innerHTML = '<div class="ligne l2 tete"><span>MGB</span><span>Fichier</span>' +
                   '<span>Taille</span><span style="text-align:right">État</span></div>';

  lot.slice(0, MAX_LIGNES).forEach(function(x, i){
    var d = document.createElement('div');
    d.className = 'ligne l2';
    d.innerHTML = '<span class="mgb"></span><span class="lib"></span><span class="meta"></span>' +
                  '<span class="act"><span class="etat" id="e' + i + '"></span></span>';
    d.querySelector('.mgb').textContent  = x.mgb;
    d.querySelector('.lib').textContent  = x.libelle;
    d.querySelector('.lib').title        = x.fichier.name;
    d.querySelector('.meta').textContent = poids(x.fichier.size);
    zone.appendChild(d);
    etat(i, x.etat, x.raison);
  });

  if(lot.length > MAX_LIGNES){
    var p = document.createElement('div');
    p.className = 'plus';
    p.textContent = (lot.length - MAX_LIGNES) + ' fichiers de plus (tous seront traités).';
    zone.appendChild(p);
  }
}

function etat(i, classe, texte){
  var el = document.getElementById('e' + i);
  if(!el) return;
  el.className = 'etat ' + classe;
  el.textContent = texte;
}

async function envoyerUne(x, i){
  /* Remplacement : on efface l'ancienne version, sinon les deux
     cohabitent et occupent le quota. */
  if(x.existant && x.existant.nomFichier){
    try {
      await fetch(API + '/archive/' + encodeURIComponent(x.existant.nomFichier),
                  { method:'DELETE', headers: auth() });
    } catch(e){}
  }

  var cible = DOSSIER + x.fichier.name;
  var r = await fetch(API + '/archive/' + encodeURIComponent(cible), {
    method:'POST', headers: auth({ 'Content-Type':'application/pdf' }), body: x.fichier
  });
  if(refus(r)) throw new Error('refus');
  if(!r.ok) throw new Error('envoi');
}

async function envoyerLot(){
  var aFaire = [];
  lot.forEach(function(x, i){ if(x.etat === 'envoi') aFaire.push({ x:x, i:i }); });
  if(!aFaire.length) return;

  document.getElementById('b-envoi').disabled = true;
  document.getElementById('dossier').disabled = true;
  document.getElementById('barre-h').classList.add('on');

  var faits = 0, echecs = 0;

  function avance(){
    var pct = Math.round(faits / aFaire.length * 100);
    document.getElementById('barre-b').style.width = pct + '%';
    document.getElementById('barre-t').textContent =
      faits + ' / ' + aFaire.length + ' fiche' + (aFaire.length > 1 ? 's' : '') + ' envoyée' +
      (faits > 1 ? 's' : '') + (echecs ? ' — ' + echecs + ' en échec' : '');
  }
  avance();

  var suivant = 0;
  async function fil(){
    while(suivant < aFaire.length){
      var t = aFaire[suivant++];
      etat(t.i, 'envoi', 'Envoi…');
      try {
        await envoyerUne(t.x, t.i);
        etat(t.i, 'ok', 'Envoyée');
      } catch(e){
        echecs++;
        etat(t.i, 'ko', 'Échec');
      }
      faits++;
      avance();
    }
  }

  var fils = [];
  for(var k = 0; k < Math.min(EN_PARALLELE, aFaire.length); k++) fils.push(fil());
  await Promise.all(fils);

  document.getElementById('dossier').disabled = false;
  dire(echecs ? (faits - echecs) + ' fiches envoyées, ' + echecs + ' en échec'
              : faits + ' fiches envoyées', echecs ? 'err' : 'ok');

  await chargerFiches();
  accroche(); afficher();
  lot.forEach(function(x){ if(x.etat === 'envoi') x.etat = 'ajour'; });
  majBilan();
}

/* ══════════ DÉMARRAGE ══════════ */
(async function(){
  try {
    await chargerFiches();
    accroche(); afficher();
  } catch(e){
    document.getElementById('accroche').textContent =
      'Archive injoignable — ' + (e && e.message ? e.message : 'erreur inconnue') + '.';
    document.getElementById('liste').innerHTML = '<div class="info">Chargement impossible.</div>';
    dire('Erreur de chargement', 'err');
  }
})();
</script>
