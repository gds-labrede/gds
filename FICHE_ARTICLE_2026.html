<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDS · Fiche article</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>window.XLSX||document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>')</script>
<script src="config.js"></script>
<style>
:root{--navy:#14254a;--navy2:#1f3a6e;--or:#f28c28;--or2:#ffb366;--bg:#e9edf4;--paper:#fffdf9;--txt:#1b2438;--mut:#7a8399;--bd:#e6e1d8;--ok:#1f9d63;--warn:#d97706;--err:#d0342c}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at top,#f4f6fa,var(--bg));color:var(--txt);min-height:100vh}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
header h1{font-size:18px;margin:0}
header .sub{font-size:12px;opacity:.7}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--or2),var(--or));display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}
.ver{font-family:'DM Mono';font-size:11px;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:6px}
.hb{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 11px;font:500 12px 'DM Sans';cursor:pointer;position:relative}
.hb:hover{background:rgba(255,255,255,.2)}
.hb .nb{position:absolute;top:-6px;right:-6px;background:var(--or);border-radius:10px;font-size:10px;padding:1px 6px}

/* recherche */
.search{max-width:760px;margin:26px auto 0;padding:0 16px;position:relative}
.sbox{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:6px 8px 6px 18px;box-shadow:0 6px 24px rgba(20,37,74,.12);border:1px solid #dde3ee}
.sbox input{flex:1;border:0;outline:0;font:500 18px 'DM Sans';padding:10px 0;background:transparent;color:var(--txt)}
.sbox .k{font-family:'DM Mono';font-size:11px;color:var(--mut);border:1px solid #dde3ee;border-radius:5px;padding:2px 6px}
.sug{position:absolute;left:16px;right:16px;top:100%;margin-top:6px;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(20,37,74,.18);overflow:hidden;z-index:20;display:none}
.sug div{padding:10px 16px;display:flex;gap:14px;align-items:center;cursor:pointer;border-bottom:1px solid #f0f2f6}
.sug div.on,.sug div:hover{background:#fff6ec}
.sug .m{font-family:'DM Mono';font-size:13px;color:var(--navy);min-width:110px}
.sug .l{flex:1;font-size:14px}
.sug .s{font-size:11px;color:var(--mut)}

/* livre */
.stage{margin:18px auto 30px;padding:0 12px}
.scene{display:flex;align-items:center;justify-content:center;gap:22px}
.book{position:relative;width:min(2600px,calc(100vw - 190px));height:max(720px,calc(100vh - 250px));display:grid;grid-template-columns:1fr 1fr;
  perspective:4200px;padding:16px;border-radius:22px;
  background:radial-gradient(ellipse at 30% 20%,#2a4a86,transparent 60%),linear-gradient(135deg,#132447,#0c1a36);
  box-shadow:0 2px 0 #0a1530,0 40px 70px -20px rgba(10,21,48,.55),0 18px 30px rgba(10,21,48,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.book::before{content:'';position:absolute;inset:6px;border-radius:17px;border:1px solid rgba(242,140,40,.35);pointer-events:none}
.ruban{position:absolute;top:-6px;right:5%;width:26px;height:92px;z-index:6;background:linear-gradient(90deg,#d8741a,#f59a3c 50%,#d8741a);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:0 4px 8px rgba(0,0,0,.25);filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.page{position:relative;overflow:hidden;background:#fffdf8;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.9),transparent 70%),linear-gradient(0deg,rgba(214,200,172,.08),rgba(214,200,172,0));}
.page.g{border-radius:10px 2px 2px 10px;box-shadow:inset -34px 0 40px -28px rgba(60,45,20,.35), -3px 0 0 #efe6d4, -5px 0 0 #fffaf0, -7px 0 0 #e9dfcb}
.page.d{border-radius:2px 10px 10px 2px;box-shadow:inset 34px 0 40px -28px rgba(60,45,20,.38), 3px 0 0 #efe6d4, 5px 0 0 #fffaf0, 7px 0 0 #e9dfcb}
.in{position:absolute;inset:0;overflow:auto;padding:50px 58px 64px;scrollbar-width:thin;scrollbar-color:#d9cfbd transparent}
.num{position:absolute;bottom:20px;left:0;right:0;text-align:center;font:500 12px 'DM Mono';color:#a99c82;letter-spacing:.2em}
.num::before,.num::after{content:'';display:inline-block;width:40px;height:1px;background:#d9cfbd;vertical-align:middle;margin:0 12px}
.run{position:absolute;top:22px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#b3a78e}
.g .run{left:58px} .d .run{left:58px}
/* feuille qui tourne */
.feuille{position:absolute;top:16px;bottom:16px;width:calc(50% - 16px);z-index:5;transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.645,.045,.355,1);will-change:transform}
.feuille.vd{left:50%;transform-origin:left center}
.feuille.vg{left:16px;transform-origin:right center}
.feuille .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.feuille .face::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .95s ease}
.feuille.vd .recto::after{background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.28))}
.feuille.vd .verso::after{background:linear-gradient(270deg,rgba(0,0,0,.02),rgba(0,0,0,.3))}
.feuille.vg .recto::after{background:linear-gradient(270deg,rgba(0,0,0,.05),rgba(0,0,0,.28))}
.feuille.vg .verso::after{background:linear-gradient(90deg,rgba(0,0,0,.02),rgba(0,0,0,.3))}
.feuille .verso{transform:rotateY(180deg)}
.feuille.go .face::after{opacity:1}
.feuille.vd.go{transform:rotateY(-180deg)}
.feuille.vg.go{transform:rotateY(180deg)}
.feuille.go{filter:drop-shadow(0 20px 25px rgba(0,0,0,.25))}
/* flèches */
.fl{flex:none;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.7);cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(236,240,247,.85));box-shadow:0 10px 24px rgba(20,37,74,.22),inset 0 1px 0 #fff;transition:transform .2s, box-shadow .2s, opacity .2s}
.fl:hover:not(:disabled){transform:scale(1.08);box-shadow:0 14px 30px rgba(242,140,40,.35),inset 0 1px 0 #fff}
.fl:hover:not(:disabled) svg{stroke:var(--or)}
.fl:disabled{opacity:.25;cursor:default}
.nav{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tabs span{font-size:12.5px;padding:7px 14px;border-radius:20px;background:#fff;color:var(--mut);cursor:pointer;box-shadow:0 1px 4px rgba(20,37,74,.08);transition:.2s}
.tabs span:hover{color:var(--navy)}
.tabs span.on{background:var(--navy);color:#fff}
.kbd{font-size:11.5px;color:var(--mut)} .kbd b{font-family:'DM Mono';border:1px solid #cfd6e4;border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:#fff;color:var(--navy)}

/* contenu : tailles relatives à la page, pour s'adapter aux grands écrans */
.in{font-size:clamp(13px,.52vw + .55vh,21px);color:var(--txt)}
.pb{min-height:100%;display:flex;flex-direction:column;gap:1.25em}
.pb > .bas{margin-top:auto}
.lb{font-size:.68em;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:500}
.eyebrow{font-size:.74em;letter-spacing:.18em;text-transform:uppercase;color:var(--or);font-weight:700}
h2.titre{font-size:2.5em;line-height:1.08;margin:.15em 0 0;color:var(--navy);font-weight:700;letter-spacing:-.015em}
.tete{display:flex;flex-direction:column;gap:.55em}
.ids{display:flex;gap:1.8em;flex-wrap:wrap}
.id .v{font-family:'DM Mono';font-size:1.15em;color:var(--navy)}
.badges{display:flex;gap:.4em;flex-wrap:wrap}
.bd{font-size:.75em;padding:.35em .8em;border-radius:20px;background:#eef1f7;color:var(--navy);font-weight:500}
.bd.o{background:#fff1e3;color:#b35c06}.bd.g{background:#e6f6ee;color:var(--ok)}.bd.r{background:#fdeeed;color:var(--err)}.bd.b{background:#e8efff;color:#2a56c6}.bd.gr{background:#eceff4;color:var(--mut)}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:1.1em;padding:1.3em 1.5em;display:grid;grid-template-columns:1fr auto;gap:.4em 1.2em;align-items:end;position:relative;overflow:hidden;box-shadow:0 14px 30px -12px rgba(20,37,74,.5)}
.hero::after{content:'';position:absolute;top:-40%;right:-10%;width:60%;height:120%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 60%)}
.hero .lb{color:rgba(255,255,255,.65)}
.hero .p{font:700 3.2em 'DM Mono';color:var(--or2);line-height:1}
.hero .p small{font:500 .3em 'DM Sans';color:#fff;opacity:.8;margin-left:.4em}
.hero .dt{font-size:.8em;opacity:.8;text-align:right;line-height:1.5}
.hero .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.4em 1.6em;font-size:.8em;opacity:.85;border-top:1px solid rgba(255,255,255,.15);padding-top:.7em;margin-top:.3em}
.hero .sub b{font-family:'DM Mono';color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.75em}
.tile{border:1px solid var(--bd);border-radius:1em;padding:.9em 1em;background:#fff;box-shadow:0 6px 16px -10px rgba(60,45,20,.25);min-width:0}
.tile .v{font-size:1.75em;font-weight:700;color:var(--navy);margin-top:.15em;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:.45em;color:var(--mut);font-weight:500;margin-left:.3em}
.tile .v2{font-size:.8em;color:var(--mut);font-weight:500;margin-top:.1em}
.bloc{border:1px solid var(--bd);border-radius:1em;background:#fff;padding:1em 1.1em}
.bloc h4{margin:0 0 .6em;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.bloc h4 span{color:var(--mut);letter-spacing:.04em;text-transform:none;font-weight:500}
.mini{width:100%;border-collapse:collapse;font-size:.88em}
.mini td{padding:.4em .2em;border-bottom:1px dotted #e3ddd1}
.mini td.n{text-align:right;font-family:'DM Mono'} .mini td.m{font-family:'DM Mono'}
.mini tr:last-child td{border-bottom:0}
.classe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.3em 1.2em;font-size:.85em}
.classe .lb{font-size:.72em}
.classe .v{font-weight:500;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{margin-bottom:1.4em}
.sec h3{font-size:.78em;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin:0 0 .6em;padding-bottom:.35em;border-bottom:2px solid var(--or);display:inline-block}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:.2em 1.4em}
.row{display:flex;justify-content:space-between;gap:.6em;padding:.55em 0;border-bottom:1px dotted #e3ddd1;font-size:.95em}
.row.full{grid-column:1/-1}
.row .lb{font-size:.72em;align-self:center}
.row .v{font-weight:500;text-align:right;word-break:break-word}
.vide{color:#c98a3a;font:italic 400 .8rem 'DM Sans'}
.tile .vide,.spec .vide{font-size:.9rem}
.corr{position:relative}
.corr::after{content:'';display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--or);margin-left:.35em;vertical-align:middle}
.remarque{background:#fff8ee;border-left:3px solid var(--or);padding:.8em 1em;border-radius:8px;line-height:1.5;white-space:pre-wrap;min-height:3em}
.src-i{font:400 .6em 'DM Sans';color:var(--mut);vertical-align:middle}
.four{display:flex;justify-content:space-between;align-items:flex-end;gap:1em;border-bottom:1px solid var(--bd);padding-bottom:.9em}
.four .nom{font-size:1.7em;font-weight:700;color:var(--navy);line-height:1.1}
.four .n{font-family:'DM Mono';font-size:.8em;color:var(--mut);white-space:nowrap}
.logi{display:grid;grid-template-columns:minmax(8em,.9fr) 2.2fr;gap:.9em;align-items:stretch}
.pal{background:#fff;border:1px solid var(--bd);border-radius:1em;padding:.8em;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.3em}
.pal svg{width:100%;max-width:8.5em;height:auto}
.pal .emb{font-weight:700;color:var(--navy);font-size:.95em}
.pal .embt{font-size:.8em;color:var(--mut)}
.specs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6em}
.spec{border:1px solid var(--bd);border-radius:.9em;padding:.7em .8em;background:#fff;min-width:0}
.spec .v{font:700 1.45em 'DM Mono';color:var(--navy);margin-top:.15em}
.spec .v small{font:500 .5em 'DM Sans';color:var(--mut)}
.secu{border-radius:1.1em;overflow:hidden;border:1px solid #f0c9c4;background:#fff}
.secu.ok{border-color:#cfe9da}
.secu .bandeau{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.9em 1.1em;background:linear-gradient(135deg,#b8342f,#d9534b);color:#fff}
.secu.ok .bandeau{background:linear-gradient(135deg,#1f8a57,#2fb170)}
.secu .bandeau .lb{color:rgba(255,255,255,.75)}
.secu .rub{font:700 2em 'DM Mono';line-height:1}
.secu .rubl{font-size:.82em;opacity:.95;margin-top:.25em;max-width:30em}
.secu .corps{padding:1em 1.1em;display:flex;flex-direction:column;gap:1em}
.fdsb{display:inline-flex;gap:.5em;align-items:center;background:#fff;color:var(--navy);text-decoration:none;font-size:.85em;font-weight:700;padding:.6em .9em;border-radius:.7em;border:0;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.danger{display:grid;grid-template-columns:auto 1fr;gap:1.2em;align-items:start}
.pictos{display:flex;gap:.5em;flex-wrap:wrap;max-width:11em}
.pc{display:flex;flex-direction:column;align-items:center;width:5.2em;text-align:center;font-size:.66em;color:var(--txt);gap:.1em;line-height:1.2}
.pc svg{width:4.4em;height:4.4em}
.hphr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4em;font-size:.86em}
.hphr li{display:grid;grid-template-columns:4.3em 1fr;gap:.5em}
.hphr b{font-family:'DM Mono';color:var(--err);font-weight:500}
.conseils{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.cs{border-radius:.8em;padding:.7em .9em;background:#f7f8fb;border:1px solid var(--bd)}
.cs .v{font-weight:700;color:var(--navy);margin-top:.2em;font-size:.95em}
.cs .d{font-size:.78em;color:var(--mut);margin-top:.2em;line-height:1.35}
.cs.or{background:#fff6ec;border-color:#f6d3ad}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;border:1px solid var(--or);border-radius:12px;padding:10px;width:100%;font-size:13px}
.pk label{display:flex;flex-direction:column;align-items:center;font-size:10.5px;cursor:pointer;border-radius:8px;padding:4px;border:2px solid transparent}
.pk label.on{border-color:var(--or);background:#fff4e8}
.pk input{display:none}
.pk .ok{grid-column:1/-1;justify-self:end}

/* édition */
body.edit [data-k]{cursor:text;border-radius:5px;outline:1px dashed #c9b99a;outline-offset:2px}
body.edit [data-k]:hover{background:#fff3e2}
body.edit .hero [data-k]{outline-color:rgba(255,255,255,.45)}
body.edit .hero [data-k]:hover{background:rgba(255,255,255,.1)}
.ed{font:inherit;color:inherit;border:1px solid var(--or);border-radius:6px;padding:2px 6px;background:#fff;width:100%;text-align:inherit;outline:0}
.hero .ed{background:rgba(255,255,255,.95);color:var(--navy)}
textarea.ed{min-height:90px;text-align:left}
.bar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.btn{font:500 13px 'DM Sans';border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(20,37,74,.1);display:inline-flex;gap:7px;align-items:center}
.btn.on{background:linear-gradient(145deg,var(--or2),var(--or));color:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* tableaux pages 3-4 */
table{width:100%;border-collapse:collapse;font-size:.92em}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:2px solid var(--navy);font-weight:500}
td{padding:8px 6px;border-bottom:1px dotted #e3ddd1}
td.n{text-align:right;font-family:'DM Mono'} td.m{font-family:'DM Mono'}
.tot td{font-weight:700;border-top:2px solid var(--navy);border-bottom:0}
.lien{color:var(--or);cursor:pointer;font-weight:500;background:none;border:0;font:inherit;padding:0}
.hist-v{font-family:'DM Mono';font-size:12px}
.barre{text-decoration:line-through;color:var(--mut)}

/* accueil */
.cover{max-width:640px;margin:40px auto;text-align:center;padding:0 16px}
.drop{border:2px dashed #b9c3d8;border-radius:16px;padding:34px;background:#fff;cursor:pointer;color:var(--mut)}
.drop:hover,.drop.on{border-color:var(--or);background:#fff7ef;color:var(--txt)}
.drop b{color:var(--navy)}
.stat{font-size:13px;color:var(--mut);margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:15px}

.etat{font-size:11.5px;opacity:.85;display:flex;align-items:center;gap:6px}
.etat i{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
.etat.att i{background:var(--or2)} .etat.err i{background:#f87171}
.load{width:44px;height:44px;border-radius:50%;border:4px solid #dde3ee;border-top-color:var(--or);margin:40px auto 0;animation:tour 1s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
.mentions{font-family:'DM Mono';font-size:12px;color:var(--err);margin-top:4px}
.src-i{font-size:10.5px;color:var(--mut);font-weight:400}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:50;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast button{background:none;border:0;color:var(--or2);font:700 13px 'DM Sans';cursor:pointer}

@media (max-width:960px){
  header .sub,.ver{display:none}
  header{padding:10px 12px;gap:10px}
  .hb{padding:6px 8px;font-size:11px}
  .logi{grid-template-columns:1fr}
  .scene{gap:0;position:relative}
  .fl{position:absolute;z-index:8;width:46px;height:46px;top:50%;transform:translateY(-50%)}
  .fl:hover:not(:disabled){transform:translateY(-50%) scale(1.05)}
  #prev{left:-4px} #next{right:-4px}
  .book{width:calc(100vw - 24px);height:calc(100vh - 230px);min-height:560px;grid-template-columns:1fr;padding:10px}
  .book .page.d{display:none}
  .page.g{border-radius:10px}
  .feuille{top:10px;bottom:10px;width:calc(100% - 20px)}
  .feuille.vd,.feuille.vg{left:10px}
  .in{padding:44px 24px 58px}
  .ruban{right:10%}
  .rows{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  h2.titre{font-size:24px}
}
</style>
</head>
<body>
<header>
  <div class="logo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M4 19.5A2 2 0 0 0 6 22h13v-3"/><path d="M9 7h6M9 11h4"/></svg></div>
  <div><h1>Fiche article</h1><div class="sub" id="hsub">Dépôt 171 · La Brède</div></div>
  <div class="hr">
    <span class="etat" id="etat"></span>
    <button class="hb" id="hRel" title="Relire la base, le stock et les FDS dans GDS">Actualiser</button>
    <span class="ver">v10</span>
  </div>
</header>

<script>
/* ================= état ================= */
var STOCK = null, STOCK_DATE = '', ART = null, EDIT = false;
var AUJ = new Date().toISOString().slice(0,10);
/* ================= GDS : dossier BASE_ARTICLES/ de l'archive ================= */
var API = (window.GDS && GDS.API) || '', CLE = (window.GDS && GDS.CLE_PUBLIQUE) || '';
function lireS(c){ try { return sessionStorage.getItem(c) || localStorage.getItem(c); } catch(e){ return null; } }
var JETON = lireS('gds_jeton'), ROLE = lireS('gds_role') || '', QUI = lireS('gds_nom') || ROLE || '?';
/* seuls Patrick (admin) et Maxime (admin restreint) modifient */
var PEUT = ROLE === 'admin' || ROLE === 'admin_restreint';
var DOSSIER = 'BASE_ARTICLES/', F_BASE = DOSSIER + 'base_articles.json.gz', F_SAISIES = DOSSIER + 'saisies.json', F_HIST = DOSSIER + 'historique/';
function auth(sup){ var h = {'Authorization':'Bearer ' + CLE, 'apikey':CLE, 'X-GDS-Session':JETON}; if(sup) for(var k in sup) h[k] = sup[k]; return h; }
function Refus(){ this.message = 'accès refusé par le serveur'; }
async function gds(chemin, opt){
  var r = await fetch(API + chemin, Object.assign({headers:auth()}, opt || {}));
  if(r.status === 401 || r.status === 403) throw new Refus();
  return r;
}
async function listeCourant(){
  var r = await gds('/fichiers', {method:'POST', headers:auth({'Content-Type':'application/json'}), body:JSON.stringify({prefix:''})});
  if(!r.ok) throw new Error('liste de l\'espace courant indisponible');
  var d = await r.json();
  return (Array.isArray(d) ? d : []).filter(function(f){ return f.name; }).map(function(f){ return {nom:f.name, date:f.updated_at || f.created_at || ''}; });
}
async function listeArchive(prefixe){
  var r = await gds('/archive', {method:'POST', headers:auth({'Content-Type':'application/json'}), body:JSON.stringify({prefix:prefixe})});
  if(!r.ok) throw new Error('liste de l\'archive indisponible');
  var d = await r.json();
  return (d.files || []).map(function(f){ return {nom:f.fileName, date:String(f.uploadTimestamp || ''), taille:f.contentLength || 0}; });
}
async function lireArchive(chemin){
  var r = await gds('/archive/' + encodeURIComponent(chemin));
  if(r.status === 404) return null;
  if(!r.ok) throw new Error('lecture de ' + chemin + ' impossible');
  return await r.arrayBuffer();
}
async function ecrireArchive(chemin, corps, type){
  var r = await gds('/archive/' + encodeURIComponent(chemin), {method:'POST', headers:auth({'Content-Type':type}), body:corps});
  if(!r.ok) throw new Error('écriture de ' + chemin + ' impossible');
}
async function compresser(texte){
  if(!window.CompressionStream) return new Blob([texte], {type:'application/json'});
  return await new Response(new Blob([texte]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
}
async function decompresser(buf){
  var u = new Uint8Array(buf);
  if(u[0] === 0x1f && u[1] === 0x8b) return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return new TextDecoder().decode(buf);
}

/* ----- cache local (IndexedDB) : la base n'est retéléchargée que si elle a changé ----- */
var DB = null;
function idb(){ return new Promise(function(ok){
  if(DB) return ok(DB);
  try { var r = indexedDB.open('gds-base-articles', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('k'); };
        r.onsuccess = function(){ DB = r.result; ok(DB); }; r.onerror = function(){ ok(null); }; } catch(e){ ok(null); }
}); }
async function lire(k){ var d = await idb(); if(!d) return null; return new Promise(function(ok){ var t = d.transaction('k').objectStore('k').get(k); t.onsuccess = function(){ ok(t.result || null); }; t.onerror = function(){ ok(null); }; }); }
async function ecrire(k, v){ var d = await idb(); if(!d) return false; return new Promise(function(ok){ var t = d.transaction('k','readwrite'); t.objectStore('k').put(v, k); t.oncomplete = function(){ ok(true); }; t.onerror = function(){ ok(false); }; }); }

/* ----- chargement base + saisies + ICPE ----- */
var BASE = null, SAISIES = {version:1, champs:{}, historique:[]}, ICPE = {}, ICPE6 = {}, REFS = {}, REFS6 = {}, ICPE_INFO = {}, FDSL = {}, ATTENTE = [], PILE = [];
async function chargerBase(){
  var L = await listeArchive(DOSSIER);
  var fb = L.filter(function(f){ return f.nom === F_BASE; })[0];
  if(!fb){ BASE = null; return false; }
  var c = await lire('base');
  if(c && c.date === fb.date && c.json){ BASE = c.json; return true; }
  var b = await lireArchive(F_BASE);
  BASE = JSON.parse(await decompresser(b));
  await ecrire('base', {date:fb.date, json:BASE});
  return true;
}
async function lireSaisies(){
  var b = await lireArchive(F_SAISIES), j = null;
  if(b){ try { j = JSON.parse(new TextDecoder().decode(b)); } catch(e){} }
  if(!j || !j.champs) j = {version:1, champs:{}, historique:[]};
  j.historique = j.historique || [];
  return j;
}
async function chargerSaisies(){
  SAISIES = await lireSaisies();
  ATTENTE = (await lire('attente')) || [];
  ATTENTE.forEach(function(x){ appliquerSaisie(SAISIES, x); });
  if(ATTENTE.length) pousser();
}
function lireCSVIcpe(texte){
  var fin = texte.indexOf('\n'), tete = texte.slice(0, fin < 0 ? 200 : fin);
  var sep = (tete.split(';').length > tete.split(',').length) ? ';' : (tete.indexOf('\t') >= 0 ? '\t' : ',');
  var lignes = [], champ = '', ligne = [], g = false;
  for(var i = 0; i < texte.length; i++){
    var c = texte[i];
    if(g){ if(c === '"'){ if(texte[i+1] === '"'){ champ += '"'; i++; } else g = false; } else champ += c; }
    else if(c === '"') g = true;
    else if(c === sep){ ligne.push(champ); champ = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && texte[i+1] === '\n') i++; ligne.push(champ); champ = ''; if(ligne.length > 1 || ligne[0] !== '') lignes.push(ligne); ligne = []; }
    else champ += c;
  }
  if(champ !== '' || ligne.length){ ligne.push(champ); lignes.push(ligne); }
  return lignes;
}
async function chargerSecurite(){
  /* 1. référentiel ICPE de GDS (celui de « Contrôle ICPE ») : systeme/icpe_refs.csv, MGB;CODE */
  ICPE_INFO = {ref:'absent', lignes:0, codes:0, fds:0};
  try {
    var r = await gds('/fichier/' + encodeURIComponent('systeme/icpe_refs.csv'));
    if(r.ok){
      var buf = await r.arrayBuffer(), t = new TextDecoder('utf-8').decode(buf);
      if(t.indexOf('�') !== -1) t = new TextDecoder('windows-1252').decode(buf);
      var L = lireCSVIcpe(t.replace(/^﻿/, ''));
      REFS = {}; REFS6 = {};
      L.forEach(function(c, i){
        if(i === 0 && !/\d{5,}/.test(c[0] || '')) return;                 // en-tête
        var m = String(c[0] || '').replace(/\D/g, '').replace(/^0+(?=\d{12}$)/, ''), code = String(c[1] || '').trim();
        ICPE_INFO.lignes++;
        if(!m || !code || code === '?') return;
        ICPE_INFO.codes++;
        if(m.length <= 6) REFS6[m.padStart(6, '0')] = code;
        else { var k = mgb12(m); REFS[k] = code; if(!REFS6[k.slice(0,6)]) REFS6[k.slice(0,6)] = code; }
      });
      ICPE_INFO.ref = 'ok';
    } else ICPE_INFO.ref = r.status === 404 ? 'absent' : 'erreur ' + r.status;
  } catch(e){ ICPE_INFO.ref = 'erreur : ' + (e.message || e); }
  /* 2. FDS de l'archive : fichiers PDF et fds_icpe.json (rubrique, mentions, pictogrammes) */
  try {
    var L2 = await listeArchive('FDS/'); FDSL = {};
    L2.forEach(function(f){ var m = f.nom.slice(4).match(/^(\d{8,14})[_\-\s]/); if(m && /\.pdf$/i.test(f.nom)) FDSL[mgb12(m[1])] = f.nom; });
    var fi = L2.filter(function(f){ return f.nom === 'FDS/fds_icpe.json'; })[0], j = null, c = await lire('icpe');
    if(fi && c && c.date === fi.date) j = c.json;
    else if(fi){ var b = await lireArchive('FDS/fds_icpe.json'); j = JSON.parse(new TextDecoder().decode(b)); await ecrire('icpe', {date:fi.date, json:j}); }
    ICPE = {}; ICPE6 = {};
    if(j && j.fiches) Object.keys(j.fiches).forEach(function(m){ var k = mgb12(m); ICPE[k] = j.fiches[m]; if(!ICPE6[k.slice(0,6)]) ICPE6[k.slice(0,6)] = j.fiches[m]; });
    ICPE_INFO.fds = Object.keys(ICPE).length;
  } catch(e){}
}


/* ----- pictogrammes : FDS, sinon déduits des mentions H (règlement CLP), sinon de la rubrique ICPE ----- */
function pictosDesMentions(txt){
  var H = String(txt || '').toUpperCase().match(/EUH\d{3}|H\d{3}/g) || [], P = {};
  var n = function(h){ return +h.slice(1); };
  H.forEach(function(h){
    if(/^EUH/.test(h)) return;
    var x = n(h);
    if(x >= 200 && x <= 205) P.SGH01 = 1;
    if(x === 240 || x === 241) { P.SGH01 = 1; P.SGH02 = 1; }
    if([220,221,222,223,224,225,226,228,242,250,251,252,260,261].indexOf(x) >= 0) P.SGH02 = 1;
    if(x >= 270 && x <= 272) P.SGH03 = 1;
    if(x === 280 || x === 281) P.SGH04 = 1;
    if(x === 290 || x === 314 || x === 318) P.SGH05 = 1;
    if([300,301,310,311,330,331].indexOf(x) >= 0) P.SGH06 = 1;
    if([302,312,315,317,319,332,335,336].indexOf(x) >= 0) P.SGH07 = 1;
    if([304,334,340,341,350,351,360,361,362,370,371,372,373].indexOf(x) >= 0) P.SGH08 = 1;
    if(x === 400 || x === 410 || x === 411) P.SGH09 = 1;
  });
  if(P.SGH06) delete P.SGH07;
  if(P.SGH05 && !H.some(function(h){ return /^H(302|312|317|332|335|336)$/.test(h); })) delete P.SGH07;
  return Object.keys(P).sort();
}
function pictosDeLaRubrique(r){
  var P = {};
  (String(r || '').match(/\d{4}/g) || []).forEach(function(c){
    if(['4330','4331','4320','4321','4755'].indexOf(c) >= 0) P.SGH02 = 1;
    if(c === '4718'){ P.SGH02 = 1; P.SGH04 = 1; }
    if(c === '4441') P.SGH03 = 1;
    if(c === '1630') P.SGH05 = 1;
    if(['4510','4511','4741'].indexOf(c) >= 0) P.SGH09 = 1;
  });
  return Object.keys(P).sort();
}
/* ----- vue d'un article : base + ICPE des FDS + saisies manuelles ----- */
function vide(v){ return v == null || v === '' || (Array.isArray(v) && !v.length) || (typeof v === 'number' && isNaN(v)); }
function egal(a, b){
  if(Array.isArray(a) || Array.isArray(b)) return JSON.stringify(a || []) === JSON.stringify(b || []);
  return (vide(a) && vide(b)) || a === b;
}
function fusion(m){
  var b = BASE.articles[m] || {mgb:m}, a = Object.assign({}, b), C = SAISIES.champs[m] || {}, i = ICPE[m] || ICPE6[String(m).slice(0,6)];
  a._corr = {}; a._src = {};
  var ref = REFS[m] || REFS6[String(m).slice(0,6)];
  if(ref){ a.icpe = ref; a._src.icpe = 'réf. ICPE'; }
  if(i){
    if(!ref && i.rubrique && i.rubrique !== '?'){ a.icpe = i.rubrique; a._src.icpe = 'FDS'; }
    var p = String(i.pictos || '').match(/SGH0?\d/gi);
    if(p && p.length){ a.pictos = p.map(function(x){ return 'SGH0' + x.slice(-1); }); a._src.pictos = 'FDS'; }
    if(i.mentions) a.mentions = i.mentions;
  }
  if(!a.pictos || !a.pictos.length){
    var pd = pictosDesMentions(a.mentions);
    if(pd.length){ a.pictos = pd; a._src.pictos = 'mentions H'; }
    else { pd = pictosDeLaRubrique(a.icpe); if(pd.length){ a.pictos = pd; a._src.pictos = 'rubrique'; } }
  }
  if(!a.fds && FDSL[m]) { a.fds = FDSL[m].slice(4); a._src.fds = 'archive'; }
  Object.keys(C).forEach(function(k){
    var s = C[k];
    if(k === 'prix'){
      if(b.prixDate && s.le < b.prixDate) return;           // un prix plus récent est arrivé par le data
      a.prixPrec = b.prix; a.prixPrecDate = b.prixDate; a.prix = s.v; a.prixDate = s.le; a.prixSource = 'saisie manuelle';
      return;
    }
    if(!vide(a[k]) && !egal(a[k], s.v)) a._corr[k] = {orig:a[k], le:s.le, par:s.par};
    a[k] = s.v; delete a._src[k];
  });
  if(a.ccvm && a.prix != null) a.prixPiece = Math.round(a.prix / a.ccvm * 10000) / 10000;
  return a;
}

/* ----- saisies : enregistrées dans GDS, avec historique ----- */
function appliquerSaisie(S, x){
  if(S.historique.some(function(h){ return h.id === x.id; })) return;
  S.historique.push(x);
  var b = ((BASE && BASE.articles[x.mgb]) || {})[x.k];
  var C = S.champs[x.mgb] = S.champs[x.mgb] || {};
  if(x.k !== 'prix' && egal(b, x.apres)) delete C[x.k];
  else C[x.k] = {v:x.apres, le: x.k === 'prix' ? x.jour : x.le.slice(0,10), par:x.par};
  if(!Object.keys(C).length) delete S.champs[x.mgb];
}
function saisir(m, k, nv){
  if(!PEUT) return false;
  var avant = fusion(m)[k];
  if(egal(avant, nv)) return false;
  var x = {id: Date.now() * 1000 + Math.floor(Math.random()*1000), mgb:m, k:k, avant: vide(avant) ? null : avant, apres: vide(nv) ? null : nv,
           le:new Date().toISOString(), jour:new Date().toISOString().slice(0,10), par:QUI};
  appliquerSaisie(SAISIES, x);
  ATTENTE.push(x); ecrire('attente', ATTENTE);
  PILE.push(x.id);
  pousser();
  return x;
}
function retablir(id){
  var x = SAISIES.historique.find(function(h){ return h.id === id; });
  if(x) return saisir(x.mgb, x.k, x.avant);
}
function annulerDerniere(){
  var id = PILE.pop(); if(id == null) return null;
  var x = SAISIES.historique.find(function(h){ return h.id === id; }); if(!x) return null;
  saisir(x.mgb, x.k, x.avant); PILE.pop();
  return x;
}
var ENVOI = false, tR;
async function pousser(){
  if(ENVOI || !ATTENTE.length){ etatSynchro(); return; }
  ENVOI = true; etatSynchro();
  var lot = ATTENTE.slice();
  try {
    var serveur = await lireSaisies();                       // on repart de la version du serveur
    lot.forEach(function(x){ appliquerSaisie(serveur, x); });
    serveur.majLe = new Date().toISOString(); serveur.par = QUI;
    await ecrireArchive(F_SAISIES, JSON.stringify(serveur), 'application/json');
    ATTENTE = ATTENTE.filter(function(x){ return lot.indexOf(x) < 0; });
    await ecrire('attente', ATTENTE);
    SAISIES = serveur; ATTENTE.forEach(function(x){ appliquerSaisie(SAISIES, x); });
    ENVOI = false; etatSynchro();
    if(typeof apresSynchro === 'function') apresSynchro();
    if(ATTENTE.length) pousser();
  } catch(e){
    ENVOI = false; etatSynchro(e instanceof Refus ? 'refus' : 'erreur');
    clearTimeout(tR); tR = setTimeout(pousser, 15000);
  }
}
function etatSynchro(err){
  var e = document.getElementById('etat'); if(!e) return;
  var t, c = '';
  if(err === 'refus'){ t = 'Enregistrement refusé par GDS'; c = 'err'; }
  else if(err){ t = ATTENTE.length + ' modif. en attente · nouvel essai'; c = 'err'; }
  else if(ENVOI || ATTENTE.length){ t = 'Enregistrement dans GDS…'; c = 'att'; }
  else t = 'Enregistré dans GDS';
  e.className = 'etat ' + c; e.innerHTML = '<i></i>' + t;
  var u = document.getElementById('bUndo'); if(u) u.disabled = !PILE.length;
}
window.addEventListener('beforeunload', function(e){ if(ATTENTE.length){ e.preventDefault(); e.returnValue = ''; } });

/* champs : clé, libellé, type (t texte, n nombre, d date, b oui/non, l long) */
var CH = {
  libelle:['Libellé','t'], ean:['EAN','t'], subsys:['Subsys','t'], mgb6:['MGB 6','t'],
  saNum:['N° SA','t'], secteur:['Secteur (SA)','t'], svNum:['N° SV','t'], rayon:['Rayon (SV)','t'],
  ga:['Groupe (GA)','t'], sga:['Sous-groupe (SGA)','t'], ssga:['Famille (SSGA)','t'],
  fournisseur:['Fournisseur','t'], fournisseurNum:['N° fournisseur','t'],
  unite:['Unité','t'], ccaf:['CCAF','n'], ccvm:['CCVM (pièces)','n'], umc:['UMC','n'],
  emballage:['Emballage','s',['Europe (EPAL)','Logipal','CHEP','Palette perdue','Demi-palette','Quart de palette','Rolls','Bac plastique','Carton seul']],
  tailleEmballage:['Taille emballage','s',['80 × 120','100 × 120','60 × 80','40 × 60','120 × 120']],
  poidsColis:['Poids colis (kg)','n'], pictos:['Pictogrammes de danger','p'], fds:['Fiche FDS','u'],
  colisCouche:['Colis / couche','n'], colisPalette:['Colis / palette','n'], dlv:['DLV (jours)','n'], typeDate:['Type de date','s',['DLC','DDM']], abc:['Classe ABC','t'],
  prix:['Prix unitaire','n'], prixDate:['Date du prix','d'], prixSource:['Source du prix','t'], prixPiece:['Prix à la pièce','n'],
  prixPrec:['Prix précédent','n'], prixPrecDate:['Date prix précédent','d'],
  icpe:['Rubrique ICPE','t'], activation:['Article activé','b'], codeBlocage:['Code blocage','t'],
  creeLe:['Créé le','d'], ajouteLe:['Ajouté à la base','d'], majLe:['Mis à jour le','d'], remarque:['Remarque','l']
};
var PAGES = ['L\'essentiel','Logistique & sécurité','Classification & achat','Stock du jour','Historique','Notes'];

/* ================= pictogrammes SGH ================= */
var SGH = {
  SGH01:['Explosif','<circle cx="32" cy="36" r="7" fill="#111"/><path d="M32 18v8M32 46v8M16 36h8M40 36h8M21 25l6 6M37 41l6 6M43 25l-6 6M21 47l6-6" stroke="#111" stroke-width="3" stroke-linecap="round"/>'],
  SGH02:['Inflammable','<path d="M32 16c2 8 12 12 12 24a12 12 0 0 1-24 0c0-6 4-9 5-14 2 4 3 6 5 7 1-6 0-11 2-17z" fill="#111"/><rect x="18" y="48" width="28" height="3" fill="#111"/>'],
  SGH03:['Comburant','<circle cx="32" cy="42" r="9" fill="none" stroke="#111" stroke-width="4"/><path d="M32 14c2 6 8 9 8 17a8 8 0 0 1-16 0c0-4 3-6 3-10 2 3 3 4 4 4 0-4 0-7 1-11z" fill="#111"/>'],
  SGH04:['Gaz sous pression','<rect x="18" y="28" width="30" height="14" rx="7" fill="#111" transform="rotate(-20 32 35)"/><rect x="44" y="24" width="5" height="8" fill="#111" transform="rotate(-20 32 35)"/>'],

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function norm(s){ return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
function fr(d){ return d && /^\d{4}-\d\d-\d\d/.test(d) ? d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4) : (d || ''); }
function px(n){ return n == null || n === '' ? '' : (+n).toLocaleString('fr-FR',{minimumFractionDigits:2, maximumFractionDigits:4}); }
function eur(n){ return (+n).toLocaleString('fr-FR',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' €'; }
function nb(n){ return n == null || n === '' ? '' : (+n).toLocaleString('fr-FR',{maximumFractionDigits:3}); }
function aff(k, v){

  if(vide(v)) return '';

function lireStock(texte){
  var wb = XLSX.read(texte, {type:'string', raw:true});
  var L = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
  var h = L[0].map(norm), c = function(n){ return h.indexOf(n); };
  var iM = c('mgb'), iL = c('location code'), iP = c('position'), iQ = c('quantity'), iB = c('bbd'), iA = c('picking area'), iS = c('sscc');
  if(iM < 0 || iQ < 0) return null;
  var S = {};
  L.slice(1).forEach(function(l){
    var m = mgb12(l[iM]); if(!m) return;
    (S[m] = S[m] || []).push({zone:l[iA], pos:l[iP], loc:l[iL], q:+String(l[iQ]).replace(',','.') || 0, dlc:l[iB], sscc:l[iS]});
  });
  return S;
}

async function charger(){
  try {
    if(!API){ acc('config.js introuvable', 'La page doit être publiée dans GDS, à côté de config.js.'); return; }
    if(!JETON){ acc('Connexion requise', 'Ouvre la fiche article depuis le sommaire GDS.'); return; }
    etat('Lecture de GDS…', 'att');
    if(!(await chargerBase())){ acc('Base articles vide', 'Elle doit d\'abord être construite depuis la page « Base articles » (Patrick ou Maxime).'); etat('Base absente', 'err'); return; }
    await chargerSaisies();
    demarrer();
    // compléments en arrière-plan : ICPE et FDS de l'archive, stock du jour
    chargerSecurite().then(function(){ if(ART){ ART = fusion(ART.mgb); rendre(); } });
    listeCourant().then(chargerStock).catch(function(){});
  } catch(e){
    if(e instanceof Refus){ acc('Accès refusé par le serveur', 'Ta session est peut-être expirée : rouvre la fiche depuis le sommaire.'); etat('Accès refusé', 'err'); }
    else {
      var c = await lire('base');
      if(c && c.json && !BASE){ BASE = c.json; demarrer(); etat('Hors ligne : copie locale', 'err'); }
      else { acc('GDS injoignable', e.message); etat('GDS injoignable', 'err'); }
    }
  }
}

async function chargerStock(L){
  try {
    var f = L.filter(function(x){ return /^StockStatus_.*\.csv$/i.test(x.nom); })
             .sort(function(a, b){ return dateNom(a.nom) + a.date < dateNom(b.nom) + b.date ? 1 : -1; })[0];
    if(!f) return;
    var c = await lire('stock');
    if(c && c.nom === f.nom && c.date === f.date){ STOCK = c.data; STOCK_DATE = c.jour; }
    else {
      var r = await gds('/fichier/' + encodeURIComponent(f.nom));
      if(!r.ok || !window.XLSX) return;
      var S = lireStock(await r.text()); if(!S) return;
      STOCK = S; STOCK_DATE = dateNom(f.nom) || AUJ;
      await ecrire('stock', {nom:f.nom, date:f.date, jour:STOCK_DATE, data:S});
    }
    infoBase(); if(ART) rendre();
  } catch(e){}
}

var SUG = [], SUGI = 0;
function chercher(q){
  q = norm(q); if(q.length < 2) return [];
  var chiffres = /^\d+$/.test(q), res = [], A = BASE.articles, C = (SAISIES && SAISIES.champs) || {};
  for(var m in A){
    var a = A[m], sc = 0;
    if(C[m]){ a = Object.assign({}, a); Object.keys(C[m]).forEach(function(k){ a[k] = C[m][k].v; }); }
    if(chiffres){
      if(m === mgb12(q) || a.subsys === q || a.ean === q) sc = 100;
      else if(m.indexOf(q) === 0 || m.replace(/^0+/,'').indexOf(q) === 0) sc = 60;
      else if((a.subsys || '').indexOf(q) === 0 || (a.ean || '').indexOf(q) === 0) sc = 50;
      else if(m.indexOf(q) >= 0) sc = 20;
    } else {
      var l = norm(a.libelle), ok = q.split(/\s+/).every(function(w){ return l.indexOf(w) >= 0 || norm(a.fournisseur).indexOf(w) >= 0; });
      if(ok) sc = l.indexOf(q) === 0 ? 40 : 30;
    }
    if(sc){ if(STOCK && STOCK[m]) sc += 5; if(a.statut === 'inactif') sc -= 10; res.push([sc, a]); }
  }
  return res.sort(function(x, y){ return y[0] - x[0]; }).slice(0, 8).map(function(x){ return x[1]; });
}

}

qEl.onkeydown = function(e){
  if(e.key === 'ArrowDown'){ SUGI = Math.min(SUGI + 1, SUG.length - 1); montrerSug(); e.preventDefault(); }
  else if(e.key === 'ArrowUp'){ SUGI = Math.max(SUGI - 1, 0); montrerSug(); e.preventDefault(); }
  else if(e.key === 'Enter'){ if(SUG[SUGI]) ouvrir(SUG[SUGI].mgb); else toast('Aucun article trouvé'); }
  else if(e.key === 'Escape'){ SUG = []; montrerSug(); }
};

        '<div class="v2">' + (proche ? 'Plus proche en stock : ' + dateCourte(proche.dlc, proche.j) : 'Aucune date en stock') + '</div></div>' +
      '<div class="tile"><div class="lb">En stock</div><div class="v">' + (q == null ? '<span class="vide">—</span>' : nb(q) + '<small>' + sh.length + ' pos.</small>') + '</div></div>' +
    '</div>' +
    stock + classe +
    '<div class="num">1</div>';
}

function palette(){
  var t = String(ART.tailleEmballage || ''), m = t.match(/(\d+)\s*[×x*]\s*(\d+)/);
  var w = m ? +m[1] : 80, h = m ? +m[2] : 120, k = 110 / Math.max(w, h), W = w*k, H = h*k;
  var planches = '';
  for(var i = 0; i < 3; i++) planches += '<rect x="' + (70 - W/2) + '" y="' + (70 - H/2 + i*(H-10)/2) + '" width="' + W + '" height="10" fill="#e8c9a0" stroke="#b58a58"/>';
  return '<svg width="140" height="140" viewBox="0 0 140 140"><rect x="' + (70 - W/2) + '" y="' + (70 - H/2) + '" width="' + W + '" height="' + H + '" rx="3" fill="#f6e7d2" stroke="#b58a58" stroke-width="2"/>' + planches +
    '</svg>';
}
function spec(lb, k, suffixe, calc){
  var v = calc != null ? '<span>' + calc + '</span>' : champ(k);
  return '<div class="spec"><div class="lb">' + lb + '</div><div class="v">' + v + (suffixe && (calc != null || !vide(ART[k])) ? '<small> ' + suffixe + '</small>' : '') + '</div></div>';
}
function page2(){
  var a = ART, couches = a.colisPalette && a.colisCouche ? Math.round(a.colisPalette / a.colisCouche * 10) / 10 : null;
  var poidsPal = a.poidsColis && a.colisPalette ? Math.round(a.poidsColis * a.colisPalette) : null;
  var P = a.pictos || [], H = String(a.mentions || '').toUpperCase().match(/EUH\d{3}|H\d{3}/g) || [];
  var ico = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 14h6M9 17h4"/></svg>';
  var fic = FDSL[a.mgb] || FDSL[mgb12(String(a.mgb).slice(0,6) + '001001')] || '';
  var fds = /^https?:/i.test(a.fds || '') ? '<a class="fdsb" href="' + esc(a.fds) + '" target="_blank" rel="noopener">' + ico + 'Ouvrir la FDS</a>'
          : fic ? '<button class="fdsb" data-fds="' + esc(fic) + '">' + ico + 'Ouvrir la FDS</button>' : '';
  var dangereux = (String(a.icpe || '').match(/\d{4}/g) || []).some(function(c){ return c !== '1510'; }) || P.length || H.length, cs = conseilStockage(a);
  var codes = String(a.icpe || '').match(/\d{4}/g) || [];
  var secu;
  if(dangereux){
    secu = '<div class="secu">' +
      '<div class="bandeau"><div><div class="lb">Rubrique ICPE</div><div class="rub">' + champ('icpe') + '</div>' +
        '<div class="rubl">' + esc(codes.map(function(c){ return RUBRIQUES[c] || ''; }).filter(Boolean).join(' · ')) + '</div></div>' + fds + '</div>' +
      '<div class="corps">' +
        '<div class="danger"><div class="pictos" data-k="pictos" title="' + (a._src.pictos ? 'Source : ' + a._src.pictos : 'Saisis à la main') + '">' + (P.length ? P.map(function(c){ return '<div class="pc">' + picto(c, 64) + '<span>' + esc(SGH[c] ? SGH[c][0] : c) + '</span></div>'; }).join('') : '<span class="vide">pictogrammes à renseigner</span>') + (P.length && a._src.pictos && a._src.pictos !== 'FDS' ? '<div style="width:100%;font-size:.62em;color:var(--mut)">déduits ' + (a._src.pictos === 'rubrique' ? 'de la rubrique ICPE' : 'des mentions H') + ' · à confirmer avec la FDS</div>' : '') + '</div>' +
          (H.length ? '<ul class="hphr">' + H.map(function(h){ return '<li><b>' + esc(h) + '</b><span>' + esc(HPHR[h] || '') + '</span></li>'; }).join('') + '</ul>'
                    : '<span style="color:var(--mut);font-size:.85em">Mentions de danger : voir la FDS.</span>') + '</div>' +
        (cs ? '<div class="conseils"><div class="cs or"><div class="lb">Rétention</div><div class="v">' + esc(cs.ret) + '</div><div class="d">' + esc(cs.retd) + '</div></div>' +
                                     '<div class="cs"><div class="lb">Zone conseillée</div><div class="v">' + esc(cs.zone) + '</div><div class="d">' + esc(cs.zoned) + '</div></div></div>' : '') +
      '</div></div>';
  } else {
    secu = '<div class="secu ok"><div class="bandeau"><div><div class="lb">Sécurité</div><div class="rub" style="font-size:1.3em;font-family:\'DM Sans\'">Aucune rubrique ICPE connue</div>' +
      '<div class="rubl">' + (a.icpe ? 'Rubrique ' + esc(a.icpe) + ' : entrepôt couvert, pas de danger particulier' : 'Produit non classé dans le référentiel ICPE') + (fic ? '' : ' · aucune FDS dans GDS') + '</div></div>' + fds + '</div>' +
      '<div class="corps"><div class="pictos" data-k="pictos"><span style="color:var(--mut);font-size:.85em">Aucun pictogramme</span></div></div></div>';
  }
  return '<div class="run">Fiche logistique</div>' +
    '<div class="eyebrow">Logistique & sécurité</div>' +
    '<div class="four"><div><div class="lb">Fournisseur</div><div class="nom">' + champ('fournisseur') + '</div></div><div class="n">N° ' + champ('fournisseurNum') + '</div></div>' +
    '<div class="logi">' +
      '<div class="pal">' + palette() + '<div class="emb">' + champ('emballage') + '</div><div class="embt">' + champ('tailleEmballage') + '</div></div>' +
      '<div class="specs">' +
        spec('Poids colis', 'poidsColis', 'kg') + spec('Poids palette', null, 'kg', poidsPal == null ? null : nb(poidsPal)) + spec('Pièces / colis', 'ccvm') +
        spec('Colis / couche', 'colisCouche') + spec('Couches / pal.', null, '', couches == null ? null : nb(couches)) + spec('Colis / palette', 'colisPalette') +
      '</div>' +
    '</div>' +
    secu +
    '<div class="num">2</div>';
}
function page3c(){
  return '<div class="run">' + esc(ART.mgb) + '</div>' +
    '<div class="sec"><h3>Classification</h3><div class="rows">' + ['saNum','secteur','svNum','rayon'].map(function(k){ return ligne(k); }).join('') + ligne('ga', 1) + ligne('sga', 1) + ligne('ssga', 1) + '</div></div>' +
    '<div class="sec"><h3>Conditionnement</h3><div class="rows">' + ['unite','ccaf','ccvm','umc','typeDate','dlv','abc','mgb6'].map(function(k){ return ligne(k); }).join('') + '</div></div>' +
    '<div class="sec"><h3>Prix</h3><div class="rows">' + ['prix','prixDate','prixPiece','prixSource','prixPrec','prixPrecDate'].map(function(k){ return ligne(k); }).join('') + '</div></div>' +
    '<div class="sec"><h3>Suivi</h3><div class="rows">' + ['codeBlocage','activation','creeLe','ajouteLe','majLe'].map(function(k){ return ligne(k); }).join('') + ligne('fds', 1) + '</div></div>' +
    '<div class="num">3</div>';
}
function page6(){
  return '<div class="run">Notes</div><div class="eyebrow">Notes</div><h2 class="titre" style="font-size:24px">Remarques</h2>' +
    '<div class="remarque" style="min-height:260px">' + champ('remarque') + '</div><div class="num">6</div>';
}

function page3(){
  var s = stockArt(), h = '<div class="run">Stock du jour</div><div class="eyebrow">Stock du jour</div><h2 class="titre" style="font-size:24px">Emplacements</h2>';
  if(!s) return h + '<p style="color:var(--mut)">Aucun StockStatus trouvé dans GDS pour le moment.</p><div class="num">4</div>';
  h += '<p style="color:var(--mut);margin-top:0">StockStatus du ' + fr(STOCK_DATE) + '</p>';
  if(!s.length) return h + '<p>Aucun stock pour cet article.</p><div class="num">4</div>';
  var tq = 0;
  h += '<table><thead><tr><th>Emplacement</th><th>Secteur</th><th>' + esc(libDate(ART)) + '</th><th style="text-align:right">Quantité</th><th style="text-align:right">Valeur</th></tr></thead><tbody>' +
    s.slice().sort(function(x, y){ return String(x.pos) < String(y.pos) ? -1 : 1; }).map(function(x){
      var ins = /INSPECTION/i.test(x.loc); if(!ins) tq += x.q;
      return '<tr' + (ins ? ' style="color:var(--mut)"' : '') + '><td class="m">' + esc(x.pos) + '</td><td>' + esc(ins ? 'Litige' : secteurAllee(x.pos, x.zone)) + '</td><td>' + dateCourte(x.dlc, joursRestants(x.dlc)) + '</td><td class="n">' + nb(x.q) + '</td><td class="n">' + (ART.prix != null && !ins ? eur(x.q * ART.prix) : '') + '</td></tr>';
    }).join('') +
    '<tr class="tot"><td colspan="3">Total hors litige</td><td class="n">' + nb(tq) + '</td><td class="n">' + (ART.prix != null ? eur(tq * ART.prix) : '') + '</td></tr></tbody></table>';
  return h + '<div class="num">4</div>';
}

function page4(){
  var H = SAISIES.historique.filter(function(x){ return x.mgb === ART.mgb; }).slice().reverse();
  var h = '<div class="run">Historique</div><div class="eyebrow">Modifications</div><h2 class="titre" style="font-size:24px">Historique</h2>';
  if(!H.length) return h + '<p style="color:var(--mut)">Aucune modification sur cet article.</p><div class="num">5</div>';
  h += '<table><thead><tr><th>Date</th><th>Champ</th><th>Avant → après</th><th></th></tr></thead><tbody>' + H.map(function(x){
    var dl = new Date(x.le), hl = dl.toLocaleDateString('fr-FR') + ' ' + dl.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    return '<tr><td>' + hl + '<br><span style="font-size:11px;color:var(--mut)">' + esc(x.par) + '</span></td><td>' + esc((CH[x.k] || [x.k])[0]) + '</td>' +
      '<td class="hist-v"><span class="barre">' + esc(aff(x.k, x.avant) || 'vide') + '</span><br>' + esc(aff(x.k, x.apres) || 'vide') + '</td>' +
      '<td>' + (PEUT ? '<button class="lien" data-rt="' + x.id + '">Rétablir</button>' : '') + '</td></tr>';
  }).join('') + '</tbody></table>';
  return h + '<div class="num">5</div>';
}

var RENDUS = [page1, page2, page3c, page3, page4, page6];
/* une page = son contenu dans un cadre qui défile ; le numéro et le titre courant restent fixes */
function htmlPage(i){
  var h = RENDUS[i](), num = '', run = '';
  h = h.replace(/<div class="num">(\d+)<\/div>/, function(_, n){ num = n; return ''; })
       .replace(/<div class="run">([\s\S]*?)<\/div>/, function(_, r){ run = r; return ''; });
  return '<div class="run">' + run + '</div><div class="in"><div class="pb">' + h + '</div></div><div class="num">' + num + '</div>';
}
function double(){ return window.matchMedia('(min-width:961px)').matches; }
var NB = RENDUS.length, POS = 0, ANIM = false;           // POS = page de gauche affichée (paire en double page)
function pas(){ return double() ? 2 : 1; }
function peindre(){
  if(double() && POS % 2) POS--;
  document.getElementById('pg').className = 'page g';
  document.getElementById('pg').innerHTML = htmlPage(POS);
  document.getElementById('pd').innerHTML = double() && POS + 1 < NB ? htmlPage(POS + 1) : '';
  document.getElementById('prev').disabled = POS === 0;
  document.getElementById('next').disabled = POS + pas() >= NB;
  document.getElementById('tabs').innerHTML = PAGES.map(function(p, i){ var on = i === POS || (double() && i === POS + 1); return '<span data-p="' + i + '" class="' + (on ? 'on' : '') + '">' + p + '</span>'; }).join('');
  document.querySelectorAll('#tabs span').forEach(function(t){ t.onclick = function(){ allerPage(+t.dataset.p); }; });
  document.querySelectorAll('[data-rt]').forEach(function(bt){ bt.onclick = function(){ retablirH(+bt.dataset.rt); }; });
  document.querySelectorAll('[data-fds]').forEach(function(bt){ bt.onclick = function(){ ouvrirFds(bt.dataset.fds); }; });
  lierChamps();
}
function rendre(){ if(!ANIM) peindre(); }

/* tourne une feuille, vers l'avant (sens > 0) ou l'arrière, jusqu'à la page « cible » */
function tourner(cible){
  if(ANIM || !ART) return;
  if(double() && cible % 2) cible--;
  if(cible < 0 || cible >= NB || cible === POS) return;
  var sens = cible > POS ? 1 : -1, book = document.getElementById('book'), pg = document.getElementById('pg'), pd = document.getElementById('pd');
  var f = document.createElement('div'), D = double();
  ANIM = true;
  if(sens > 0){
    f.className = 'feuille vd';
    f.innerHTML = '<div class="face recto page ' + (D ? 'd' : 'g') + '">' + (D ? pd.innerHTML : pg.innerHTML) + '</div><div class="face verso page g">' + htmlPage(cible) + '</div>';
    if(D) pd.innerHTML = cible + 1 < NB ? htmlPage(cible + 1) : ''; else pg.innerHTML = htmlPage(cible);
    if(!D){ f.classList.remove('vd'); f.classList.add('vd'); }
  } else {
    f.className = 'feuille vg';
    f.innerHTML = '<div class="face recto page g">' + pg.innerHTML + '</div><div class="face verso page ' + (D ? 'd' : 'g') + '">' + (D ? (cible + 1 < NB ? htmlPage(cible + 1) : '') : htmlPage(cible)) + '</div>';
    pg.innerHTML = htmlPage(cible);
  }
  book.appendChild(f);
  f.getBoundingClientRect();                         // force le départ de l'animation
  requestAnimationFrame(function(){ f.classList.add('go'); });
  var fin = function(){ if(!ANIM) return; ANIM = false; POS = cible; f.remove(); peindre(); };
  f.addEventListener('transitionend', function(e){ if(e.target === f && e.propertyName === 'transform') fin(); });
  setTimeout(fin, 1300);
}
function allerPage(i){ tourner(double() ? i - i % 2 : i); }
function aller(d){ tourner(POS + d * pas()); }
document.getElementById('prev').onclick = function(){ aller(-1); };
document.getElementById('next').onclick = function(){ aller(1); };
window.addEventListener('resize', function(){ if(ART && !ANIM) peindre(); });

/* ================= édition ================= */
document.getElementById('bEdit').onclick = function(){
  EDIT = !EDIT; document.body.classList.toggle('edit', EDIT);
  this.classList.toggle('on', EDIT);
  this.querySelector('span').textContent = EDIT ? 'Terminer' : 'Modifier';
  if(EDIT) toast('Clique sur une valeur pour la modifier · enregistrement automatique');
};
function lierChamps(){
  document.querySelectorAll('[data-k]').forEach(function(el){
    el.onclick = function(e){
      if(!PEUT) return;
      if(!EDIT){ if(el.querySelector('.vide')){ document.getElementById('bEdit').click(); } else return; }
      if(el.querySelector('.ed') || el.querySelector('.pk')) return;
      e.stopPropagation(); editer(el);
    };
  });
}
function editer(el){
  var k = el.dataset.k, t = CH[k][1], v = ART[k], inp;
  if(t === 'p'){ editerPictos(el); return; }
  if(t === 's'){
    inp = document.createElement('select');
    var ops = CH[k][2].slice(); if(!vide(v) && ops.indexOf(v) < 0) ops.unshift(v);
    inp.innerHTML = '<option value="">—</option>' + ops.map(function(o){ return '<option>' + esc(o) + '</option>'; }).join('') + '<option value="__autre">Autre…</option>';
    inp.value = vide(v) ? '' : v;
  }
  else if(t === 'b'){ inp = document.createElement('select'); inp.innerHTML = '<option value="1">Oui</option><option value="0">Non</option>'; inp.value = v ? '1' : '0'; }
  else if(t === 'l'){ inp = document.createElement('textarea'); inp.value = v || ''; }
  else { inp = document.createElement('input'); inp.type = t === 'd' ? 'date' : 'text'; inp.value = vide(v) ? '' : (t === 'n' ? String(v).replace('.', ',') : v); if(t === 'n') inp.inputMode = 'decimal'; }
  inp.className = 'ed';
  el.innerHTML = ''; el.appendChild(inp); inp.focus(); if(inp.select && t !== 'b') inp.select();
  var fini = false;
  var valider = function(garder){
    if(fini) return; fini = true;
    if(garder){
      var nv = inp.value.trim();
      if(t === 'n'){ nv = nv === '' ? null : +nv.replace(/\s/g,'').replace(',', '.'); if(nv !== null && isNaN(nv)){ toast('Nombre invalide'); rendre(); return; } }
      else if(t === 'b') nv = nv === '1';
      else if(t === 's' && nv === '__autre'){ nv = (prompt(CH[k][0] + ' :', '') || '').trim(); if(!nv){ rendre(); return; } }
      if(k === 'ean' && nv && !/^\d{8,14}$/.test(nv)){ toast('EAN invalide : 8 à 14 chiffres'); rendre(); return; }
      modifier(k, nv);
    }
    rendre();
  };
  inp.onblur = function(){ valider(true); };
  inp.onkeydown = function(e){
    if(e.key === 'Enter' && t !== 'l'){ e.preventDefault(); valider(true); }
    if(e.key === 'Escape'){ valider(false); }
  };
  if(t === 'b' || t === 's') inp.onchange = function(){ valider(true); };
}

function editerPictos(el){
  var cur = (ART.pictos || []).slice();
  el.innerHTML = '<div class="pk">' + Object.keys(SGH).map(function(c){
    return '<label class="' + (cur.indexOf(c) >= 0 ? 'on' : '') + '"><input type="checkbox" value="' + c + '"' + (cur.indexOf(c) >= 0 ? ' checked' : '') + '>' + picto(c, 46) + SGH[c][0] + '</label>';
  }).join('') + '<button class="btn on ok">Valider</button></div>';
  el.querySelectorAll('input').forEach(function(i){ i.onchange = function(){ i.parentNode.classList.toggle('on', i.checked); }; });
  el.querySelector('.ok').onclick = function(e){
    e.stopPropagation();
    var nv = Array.from(el.querySelectorAll('input:checked')).map(function(i){ return i.value; });
    modifier('pictos', nv.length ? nv : null); rendre();
  };
}
function modifier(k, nv, silencieux, mgb){
  var m = mgb || ART.mgb;
  if(k === 'fds' && FDSL[m] && nv === FDSL[m].slice(4)) return;
  var x = saisir(m, k, nv);
  if(!x) return;
  if(ART && ART.mgb === m) ART = fusion(m);
  if(!silencieux) toast(CH[k][0] + ' enregistré', true);
}
function apresSynchro(){ if(ART && !document.querySelector('.ed,.pk')){ ART = fusion(ART.mgb); rendre(); } }
function retablirH(id){
  var x = SAISIES.historique.find(function(h){ return h.id === id; }); if(!x) return;
  retablir(id); if(ART) ART = fusion(ART.mgb);
  toast((CH[x.k] || [x.k])[0] + ' rétabli', true); rendre();
}
function annuler(){
  var x = annulerDerniere(); if(!x) return;
  if(!ART || ART.mgb !== x.mgb) ouvrir(x.mgb); else { ART = fusion(ART.mgb); rendre(); }
  toast('Modification annulée'); etatSynchro();
}
document.getElementById('bUndo').onclick = annuler;
document.getElementById('tUndo').onclick = function(){ document.getElementById('toast').classList.remove('on'); annuler(); };

async function ouvrirFds(nom){
  var w = window.open('', '_blank');
  try {
    toast('Ouverture de la FDS…');
    var r = await gds('/archive/' + encodeURIComponent(nom));
    if(!r.ok) throw 0;
    var u = URL.createObjectURL(new Blob([await r.arrayBuffer()], {type:'application/pdf'}));
    if(w) w.location = u; else location.href = u;
  } catch(e){ if(w) w.close(); toast('FDS introuvable dans GDS'); }
}

/* ================= interface ================= */
document.getElementById('hRel').onclick = function(){ charger(); };
document.addEventListener('keydown', function(e){
  var t = e.target.tagName, champ = t === 'TEXTAREA' || t === 'SELECT' || (t === 'INPUT' && (e.target !== qEl || qEl.value));
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !champ){ e.preventDefault(); annuler(); return; }
  if(champ) return;
  if(e.key === '/' && t !== 'INPUT'){ e.preventDefault(); qEl.focus(); }
  else if((e.key === 'ArrowRight' || e.key === 'PageDown') && ART){ e.preventDefault(); if(t === 'INPUT') qEl.blur(); aller(1); }
  else if((e.key === 'ArrowLeft' || e.key === 'PageUp') && ART){ e.preventDefault(); if(t === 'INPUT') qEl.blur(); aller(-1); }
  else if(e.key === 'Home' && ART){ e.preventDefault(); tourner(0); }
  else if(e.key === 'End' && ART){ e.preventDefault(); allerPage(NB - 1); }
});

charger();
</script>
